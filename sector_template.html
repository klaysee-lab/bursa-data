<title>马股板块破底翻监控</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0f14; --card:#131820; --card2:#0f141b; --bd:#232c38; --bd2:#2d3846;
    --ink:#e8eef6; --ink2:#9fb0c4; --ink3:#6b7d92;
    --up:#26a69a; --dn:#ef5350; --sup:#f2555a; --rev:#3fc98a;
    --hl:#2ea043; --btn:#1f6feb; --hlbg:rgba(46,160,67,.07);
    --mono:'IBM Plex Mono','Consolas',monospace; --body:'IBM Plex Sans','Segoe UI',system-ui,sans-serif;
  }
  :root[data-theme="light"]{
    --bg:#f2f5f9; --card:#fff; --card2:#f7f9fc; --bd:#d9e1ec; --bd2:#c4cfdd;
    --ink:#101720; --ink2:#4a5a6e; --ink3:#7b8ca1; --hlbg:rgba(46,160,67,.09);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px}
  .mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
  .wrap{max-width:1980px;margin:0 auto;padding:16px 20px 40px}

  .top{display:flex;gap:20px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;margin-bottom:10px}
  h1{margin:0;font-size:23px;font-weight:700;letter-spacing:.01em}
  h1 .pre{font-family:var(--mono);font-size:13px;color:var(--ink3);font-weight:500;margin-right:6px}
  .sub{margin:5px 0 0;color:var(--ink2);font-size:12.5px;max-width:70ch}
  .ctrl{display:flex;gap:9px;align-items:flex-end;flex-wrap:wrap}
  .fld{display:flex;flex-direction:column;gap:4px}
  .fld label{font-size:10.5px;color:var(--ink3);white-space:nowrap}
  .fld input[type=number]{width:86px;background:var(--card);border:1px solid var(--bd);color:var(--ink);
    border-radius:6px;padding:7px 9px;font-family:var(--mono);font-size:13px}
  .fld input:focus{outline:2px solid var(--btn);outline-offset:-1px}
  .scope{display:flex;flex-direction:column;gap:4px}
  .scope .row{display:flex;gap:6px}
  .chk{display:flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--bd);
    border-radius:6px;padding:7px 11px;cursor:pointer;font-size:12.5px;white-space:nowrap}
  .chk input{accent-color:var(--btn);width:14px;height:14px;cursor:pointer}
  #rescan{background:var(--btn);border:none;color:#fff;border-radius:7px;padding:9px 16px;
    font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;font-family:var(--body)}
  #rescan:hover{filter:brightness(1.12)}
  #themeBtn{background:var(--card);border:1px solid var(--bd);color:var(--ink2);border-radius:7px;
    padding:9px 12px;font-size:13px;cursor:pointer}

  .legend{display:flex;gap:16px;flex-wrap:wrap;font-size:11.5px;color:var(--ink2);margin:10px 0 4px;align-items:center}
  .legend i{display:inline-block;margin-right:5px;vertical-align:middle}
  .dot{width:8px;height:8px;border-radius:50%}
  .dash{width:16px;height:0;border-top:2px dashed var(--sup)}
  .parms{font-family:var(--mono);font-size:11px;color:var(--ink3);margin:0 0 14px}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(430px,1fr));gap:14px}
  .card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:13px 15px 11px;cursor:pointer;
    transition:border-color .12s,transform .12s}
  .card:hover{border-color:var(--bd2);transform:translateY(-1px)}
  .card.hot{border-color:var(--hl);background:linear-gradient(var(--hlbg),var(--hlbg)),var(--card);box-shadow:0 0 0 1px var(--hl) inset}
  .ch{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .nm{font-size:15px;font-weight:600;line-height:1.25}
  .sy{font-family:var(--mono);font-size:11px;color:var(--ink3);margin-top:2px}
  .rt{display:flex;align-items:center;gap:7px;flex-shrink:0}
  .ago{font-family:var(--mono);font-size:11px;background:var(--card2);border:1px solid var(--bd);
    color:var(--ink2);border-radius:5px;padding:3px 8px;white-space:nowrap}
  .card.hot .ago{background:rgba(46,160,67,.16);border-color:var(--hl);color:#7ee2a8}
  :root[data-theme="light"] .card.hot .ago{background:rgba(46,160,67,.14);color:#1a7f37;font-weight:600}
  .tv{opacity:.5;text-decoration:none;font-size:13px;line-height:1}
  .tv:hover{opacity:1}
  .cv{margin:8px 0 7px;position:relative}
  .cv svg{display:block;width:100%;height:auto}
  /* none, not pan-y: with pan-y the browser must first decide scroll-vs-page and holds
     the gesture back for ~8px of finger travel, which reads as "nothing happens yet".
     We own every touch here and scroll .mbox ourselves on a vertical swipe. */
  #mchart,#mchart svg{touch-action:none}
  .st{display:flex;gap:14px;flex-wrap:wrap;font-family:var(--mono);font-size:11.5px;
      border-top:1px solid var(--bd);padding-top:8px}
  .st b{color:var(--ink3);font-weight:400;margin-right:4px;font-size:10.5px}
  .st span{color:var(--ink);white-space:nowrap}
  .st .r{color:var(--sup)} .st .g{color:var(--rev)}
  .empty{color:var(--ink3);padding:40px 4px;font-size:13.5px;grid-column:1/-1}

  .modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;
    justify-content:center;z-index:99;padding:24px}
  .modal.on{display:flex}
  .mbox{background:var(--card);border:1px solid var(--bd2);border-radius:12px;padding:20px 22px;
    max-width:1200px;width:100%;max-height:92vh;overflow:auto}
  .mtop{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;gap:16px}
  .mx{background:none;border:none;color:var(--ink2);font-size:24px;cursor:pointer;line-height:1;padding:0 4px}
  .note{font-size:11.5px;color:var(--ink3);font-family:var(--mono);margin-top:12px;line-height:1.6}
  .tfbar{display:flex;gap:5px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
  .tfbar button{background:var(--card2);border:1px solid var(--bd);color:var(--ink2);border-radius:6px;
    padding:6px 15px;font-size:12.5px;cursor:pointer;font-family:var(--body)}
  .tfbar button:hover{border-color:var(--bd2)}
  .tfbar button.on{background:var(--btn);border-color:var(--btn);color:#fff;font-weight:600}
  .tfbar .sep{width:1px;height:22px;background:var(--bd);margin:0 5px}
  .tool.on{background:var(--sup);border-color:var(--sup);color:#fff;font-weight:600}
  #mchart{position:relative;cursor:grab}
  #mchart.draw{cursor:default}
  #mchart.draw svg{cursor:crosshair}
  .tvbtn{display:inline-flex;align-items:center;gap:6px;background:var(--card2);border:1px solid var(--bd);
    color:var(--ink2);border-radius:6px;padding:6px 11px;font-size:12px;text-decoration:none}
  .tvbtn:hover{border-color:var(--bd2);color:var(--ink)}

  /* ---- sector board additions ---- */
  .sec{border:1px solid var(--bd);border-radius:10px;margin-bottom:10px;background:var(--card2);overflow:hidden}
  .sechd{display:flex;align-items:center;gap:12px;padding:11px 14px;cursor:pointer;user-select:none}
  .sechd:hover{background:var(--card)}
  .sechd .chev{color:var(--ink3);font-size:11px;width:10px;transition:transform .15s}
  .sec.open .sechd .chev{transform:rotate(90deg)}
  .sechd .nm{font-weight:600;font-size:14.5px}
  .sechd .cnt{font-family:var(--mono);font-size:11.5px;color:var(--ink3)}
  .sechd .hot{background:var(--hlbg);border:1px solid var(--hl);color:var(--hl);
    border-radius:20px;padding:1px 9px;font-family:var(--mono);font-size:11px;font-weight:600}
  .secbody{display:none;padding:0 12px 12px}
  .sec.open .secbody{display:block}
  .more{background:none;border:1px dashed var(--bd2);color:var(--ink2);border-radius:8px;
    padding:8px 0;width:100%;cursor:pointer;font-family:var(--body);font-size:12.5px;margin-top:8px}
  .more:hover{color:var(--ink);border-color:var(--btn)}
  /* weekly range % — the number that says whether "reclaimed by 2%" means anything on this stock */
  .wr{font-family:var(--mono);font-size:10.5px;padding:1px 6px;border-radius:4px;
    background:var(--card2);border:1px solid var(--bd);color:var(--ink3);white-space:nowrap}
  .wr.hi{color:#e8b339;border-color:#6b5320}
  #mchart,#mchart svg{touch-action:none}
  /* the crosshair lives in its own overlay so a pointer move never re-renders the chart */
  #mchart .xh{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;display:none}
  #mchart .xhbox{position:absolute;left:8px;top:6px;pointer-events:none;display:none;
    font-family:var(--mono);font-size:11px;color:var(--ink2);white-space:nowrap;
    background:var(--card2);border:1px solid var(--bd);border-radius:5px;padding:3px 8px}
  #mchart .xhbox .sn{color:#e8b339;font-weight:600}
  /* ---- watchlist + search ---- */
  .find{position:relative}
  .find input{width:230px;background:var(--card);border:1px solid var(--bd);color:var(--ink);
    border-radius:6px;padding:7px 9px;font-size:13px;font-family:var(--body)}
  .find input:focus{outline:2px solid var(--btn);outline-offset:-1px}
  .hits{position:absolute;top:100%;left:0;z-index:40;margin-top:4px;width:330px;max-height:300px;overflow:auto;
    background:var(--card);border:1px solid var(--bd2);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.4);display:none}
  .hits.on{display:block}
  .hit{padding:7px 11px;cursor:pointer;font-size:12.5px;border-bottom:1px solid var(--bd)}
  .hit:last-child{border-bottom:none}
  .hit:hover,.hit.sel{background:var(--card2)}
  .hit b{font-family:var(--mono);margin-right:7px}
  .hit i{font-style:normal;color:var(--ink3);font-size:11px;display:block;margin-top:1px}
  .hit .on2{color:var(--hl);font-size:11px;float:right}
  .star{background:none;border:none;cursor:pointer;font-size:14px;line-height:1;padding:2px 3px;
    color:var(--ink3);opacity:.55}
  .star:hover{opacity:1}
  .star.on{color:#e8b339;opacity:1}
  #watchsec .sec{border-color:#6b5320}
  #watchsec .sechd .nm{color:#e8b339}


</style>

<div class="wrap">
  <div class="top">
    <div>
      <h1><span class="pre">MY</span>马股板块「破底翻」监控</h1>
      <p class="sub">Bursa 13 个板块各取市值 Top 20 — 龙头与二线一起扫 · 搜索可覆盖市值 1 亿以上的全部马股 · 跌破前低后打底数周、未再破新低，再明显拉回反转
        <span class="mono" style="color:var(--ink3)">· 构建 <b id="build"></b></span></p>
    </div>
    <div class="ctrl">
      <div class="fld"><label>支撑观察(周)</label><input type="number" id="p_sup" value="13" min="4" max="52"></div>
      <div class="fld"><label>打底最少</label><input type="number" id="p_min" value="3" min="1" max="20"></div>
      <div class="fld"><label>打底最长</label><input type="number" id="p_max" value="12" min="2" max="40"></div>
      <div class="fld"><label>容忍再深跌(%)</label><input type="number" id="p_tol" value="4" step="0.5" min="0" max="20"></div>
      <div class="fld"><label>最小反弹(%)</label><input type="number" id="p_reb" value="1.5" step="0.1" min="0" max="20"></div>
      <div class="fld"><label>「刚发生」(周)</label><input type="number" id="p_rec" value="4" min="1" max="52"></div>
      <div class="fld find"><label>加入观察清单（代码或名称）</label>
        <input type="text" id="q" placeholder="例：MAYBANK 或 1155 或 Public" autocomplete="off">
        <div class="hits" id="hits"></div></div>
      <button class="btn2" id="expall">展开全部</button>
      <button class="btn2" id="colall">收起全部</button>
      <button class="btn2" id="theme">◐</button>
    </div>
  </div>

  <div class="legend">
    <span><i class="dot g"></i>刚发生的破底翻（默认 4 周内，所在板块自动展开）</span>
    <span><i class="dot r"></i>破 = 跌破前低后的最低点</span>
    <span><i class="dot"></i>翻 = 打底结束、拉回反转的那一周</span>
    <span style="color:var(--ink3)">振幅 = 近52周 (最高−最低)/收盘 的中位数，用来判断这次反弹够不够力</span>
  </div>
  <p class="parms" id="parms"></p>
  <div id="watchsec"></div>
  <div id="secs"></div>
  <p class="note" id="foot"></p>
</div>

<div class="modal" id="modal"><div class="mbox">
  <div class="mtop"><div id="mtitle"></div><button class="mx" id="mclose">&times;</button></div>
  <div id="mbody"></div>
</div></div>

<script>
(function(){
const DATA = __DATA__;
const SNAP = "__SNAP__";
const $=id=>document.getElementById(id);
const f2=n=>n==null?'—':(Math.round(n*1000)/1000).toFixed(3);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function P(){return{
  supportWeeks:+$('p_sup').value||13, minBase:+$('p_min').value||3, maxBase:+$('p_max').value||12,
  tolPct:+$('p_tol').value||0, minReboundPct:+$('p_reb').value||0, recentWeeks:+$('p_rec').value||8
};}

function scan(w,p){
  const N=w.length,L=i=>w[i][3],C=i=>w[i][4];
  let best=null;
  for(let b=p.supportWeeks;b<N;b++){
    let sup=Infinity;
    for(let k=b-p.supportWeeks;k<b;k++) sup=Math.min(sup,L(k));
    if(!isFinite(sup)||L(b)>=sup) continue;          // must break below the prior low
    const bl=L(b);
    for(let len=p.minBase;len<=p.maxBase;len++){
      const end=b+len-1,r=b+len; if(r>=N) break;
      let low=Infinity,li=b,ok=true;
      for(let k=b;k<=end;k++){
        if(L(k)<low){low=L(k);li=k;}
        if(k>b&&L(k)<bl*(1-p.tolPct/100)){ok=false;break;}   // no meaningful new low while basing
      }
      if(!ok) continue;
      if(C(r) < sup*(1+p.minReboundPct/100)) continue;       // reversal week must clearly reclaim the level
      const c={sup,low,lowIdx:li,rev:C(r),revIdx:r,base:len,ago:N-1-r,bIdx:b,lowDate:w[li][0],revDate:w[r][0],breakDate:w[b][0]};
      if(!best||c.revIdx>best.revIdx) best=c;
      break;
    }
  }
  return best;
}

// locate a marker bar by the WEEK it belongs to, so weekly signals can be drawn on daily/hourly bars too
function findIdx(s,dateStr,mode,kind){
  if(!dateStr) return -1;
  if(mode==='w') return s.findIndex(b=>b[0]===dateStr);
  // anchor to the Monday of that week, so a weekly label on Mon or Tue both map to the same 7-day window
  const a=new Date(dateStr+'T00:00:00'); const dow=(a.getDay()+6)%7;
  const t0=a.getTime()-dow*864e5, t1=t0+7*864e5, ix=[];
  s.forEach((b,i)=>{const t=new Date(b[0].slice(0,10)+'T00:00:00').getTime(); if(t>=t0&&t<t1) ix.push(i);});
  if(!ix.length) return -1;
  if(kind==='low'){let bi=ix[0]; for(const i of ix) if(s[i][3]<s[bi][3]) bi=i; return bi;}
  return ix[ix.length-1];
}



let SC=null;   // scales of the last big chart, for converting mouse position <-> data
const bt=d=>new Date(d.length>10 ? d.replace(' ','T')+':00' : d+'T00:00:00').getTime();
// fractional bar index for a timestamp; extrapolates past either end so a line can run off-chart (SVG clips it)
function xAt(s,t){
  const n=s.length; if(!n) return 0;
  const t0=bt(s[0][0]), tN=bt(s[n-1][0]);
  const span=(tN-t0)/((n-1)||1) || 1;
  if(t<=t0) return (t-t0)/span;
  if(t>=tN) return (n-1)+(t-tN)/span;
  for(let i=0;i<n-1;i++){
    const a=bt(s[i][0]), b=bt(s[i+1][0]);
    if(t>=a&&t<=b) return i+(t-a)/((b-a)||1);
  }
  return n-1;
}
function chart(w,sig,W,H,big,mode,view,draws){
  mode=mode||'w';
  let s;
  if(view && view.i1>view.i0){ s=w.slice(Math.max(0,view.i0), Math.min(w.length,view.i1)); }
  else { const cap=(big?(mode==='w'?160:mode==='d'?245:399):130); s=w.slice(-Math.min(w.length,cap)); }
  const n=s.length;
  const padL=6,padR=big?56:46,padT=big?14:10,padB=big?24:18;
  const pw=W-padL-padR, ph=H-padT-padB;
  let lo=Infinity,hi=-Infinity;
  for(const b of s){lo=Math.min(lo,b[3]);hi=Math.max(hi,b[2]);}
  if(sig){lo=Math.min(lo,sig.sup);hi=Math.max(hi,sig.sup,sig.rev);}
  const pad=(hi-lo)*0.10||hi*0.02; lo-=pad;hi+=pad;
  const X=i=>padL+(i+.5)*(pw/n), Y=v=>padT+(1-(v-lo)/(hi-lo))*ph;
  const cw=Math.max(1.3,(pw/n)*0.62);

  let g='',cs='';
  const step=Math.pow(10,Math.floor(Math.log10(hi-lo)))* ((hi-lo)/Math.pow(10,Math.floor(Math.log10(hi-lo)))>5?2:1);
  for(let v=Math.ceil(lo/step)*step; v<hi; v+=step){
    const y=Y(v);
    g+=`<line x1="${padL}" y1="${y.toFixed(1)}" x2="${W-padR}" y2="${y.toFixed(1)}" stroke="var(--bd)" stroke-width=".6" opacity=".55"/>`;
    g+=`<text x="${W-padR+5}" y="${(y+3).toFixed(1)}" fill="var(--ink3)" font-size="${big?11:9.5}" font-family="var(--mono)">${v.toFixed(2)}</text>`;
  }
  // Batch the candles into one <path> per direction. Two SVG nodes per bar means ~1000
  // elements at 500 bars, which the browser re-parses and re-lays-out on every pan frame;
  // four paths draw identically (bodies never overlap, wicks sit inside them) for ~1/40th
  // the DOM. Bodies keep the 1px floor so a doji stays visible.
  const wick={up:'',dn:''}, body={up:'',dn:''};
  s.forEach((b,i)=>{
    const k=b[4]>=b[1]?'up':'dn', x=+X(i).toFixed(1);
    const yo=Y(b[1]), yc=Y(b[4]);
    wick[k]+=`M${x} ${Y(b[2]).toFixed(1)}V${Y(b[3]).toFixed(1)}`;
    body[k]+=`M${(x-cw/2).toFixed(1)} ${Math.min(yo,yc).toFixed(1)}h${cw.toFixed(1)}v${Math.max(1,Math.abs(yc-yo)).toFixed(1)}h${(-cw).toFixed(1)}z`;
  });
  for(const k of ['up','dn']){
    const col=k==='up'?'var(--up)':'var(--dn)';
    if(wick[k]) cs+=`<path d="${wick[k]}" stroke="${col}" stroke-width="${big?1.1:.8}" fill="none"/>`;
    if(body[k]) cs+=`<path d="${body[k]}" fill="${col}"/>`;
  }

  let an='';
  if(sig){
    const ys=Y(sig.sup);
    an+=`<line x1="${padL}" y1="${ys.toFixed(1)}" x2="${W-padR}" y2="${ys.toFixed(1)}" stroke="var(--sup)" stroke-width="1" stroke-dasharray="4,3" opacity=".85"/>`;
    const yr=Y(sig.rev);
    an+=`<line x1="${padL}" y1="${yr.toFixed(1)}" x2="${W-padR}" y2="${yr.toFixed(1)}" stroke="var(--ink3)" stroke-width=".8" stroke-dasharray="2,3" opacity=".55"/>`;
    const bi=findIdx(s,sig.lowDate,mode,'low'), ri=findIdx(s,sig.revDate,mode,'rev'), fs=big?12:10;
    if(bi>=0){const x=X(bi),y=Y(s[bi][3]);
      an+=`<path d="M${x} ${y+5} l-3.4 -5.4 h6.8 z" fill="var(--sup)"/>`+
          `<text x="${x}" y="${y+18}" fill="var(--sup)" font-size="${fs}" text-anchor="middle" font-weight="600">破</text>`;}
    if(ri>=0){const x=X(ri),y=Y(s[ri][4]);
      an+=`<path d="M${x} ${y-5} l-3.4 5.4 h6.8 z" fill="var(--rev)"/>`+
          `<text x="${x}" y="${y-10}" fill="var(--rev)" font-size="${fs}" text-anchor="middle" font-weight="600">翻</text>`;}
  }
  const last=s[s.length-1], lc=last[4], up=lc>=last[1];
  const yl2=Y(lc), bw=big?52:40;
  an+=`<rect x="${W-padR+1}" y="${(yl2-8).toFixed(1)}" width="${bw}" height="16" rx="3" fill="${up?'var(--up)':'var(--dn)'}"/>`+
      `<text x="${W-padR+1+bw/2}" y="${(yl2+4).toFixed(1)}" fill="#fff" font-size="${big?11.5:10}" text-anchor="middle" font-family="var(--mono)" font-weight="600">${lc.toFixed(2)}</text>`;

  let xl='';
  const marks=big?7:4;
  for(let k=0;k<marks;k++){
    const i=Math.round(k*(n-1)/(marks-1)), d=s[i][0].split('-');
    xl+=`<text x="${X(i).toFixed(1)}" y="${H-4}" fill="var(--ink3)" font-size="${big?10.5:9}" text-anchor="middle" font-family="var(--mono)">${d[0].slice(2)}/${d[1]}</text>`;
  }
  let dr='';
  if(big){
    SC={W,H,padL,padR,n,s,X,Y,lo,hi,ph,padT,pw};
    (draws||[]).forEach((o,k)=>{
      if(o.k==='h'){
        const y=Y(o.y); if(y<padT-2||y>padT+ph+2) return;
        dr+=`<line x1="${padL}" y1="${y.toFixed(1)}" x2="${W-padR}" y2="${y.toFixed(1)}" stroke="#e8b339" stroke-width="1.2" stroke-dasharray="6,3"/>`
          + `<text x="${padL+4}" y="${(y-4).toFixed(1)}" fill="#e8b339" font-size="10.5" font-family="var(--mono)">${o.y.toFixed(3)}</text>`;
      }else{
        // anchor by TIME, not bar index, so a line drawn on 周线 lands correctly on 日线/小时线 too
        const i1=xAt(s,bt(o.d1)), i2=xAt(s,bt(o.d2));
        dr+=`<line x1="${X(i1).toFixed(1)}" y1="${Y(o.y1).toFixed(1)}" x2="${X(i2).toFixed(1)}" y2="${Y(o.y2).toFixed(1)}" stroke="#e8b339" stroke-width="1.4"/>`;
      }
    });
  }
  return `<svg viewBox="0 0 ${W} ${H}">${g}${cs}${an}${dr}${xl}</svg>`;
}

// ---- watchlist -----------------------------------------------------------
// A pinned set of tickers rendered above the sectors, so the names you actually follow
// are not buried three sections down. Kept in the artifact db (same store as the
// drawings) so it follows you across devices, with localStorage as the local record.
const WKEY='bursa_sector_watch_v1';

try{ const raw=localStorage.getItem(WKEY); if(raw) WATCH=new Set(JSON.parse(raw)||[]); }catch(e){}

async function initWatchDB(){
  try{
    if(!window.claude||typeof window.claude.use!=='function') return;
    const db=await claude.use('db'); if(!db) return;
    WDOC=db.doc('watch/list');
    let first=true;
    WDOC.onSnapshot(snap=>{
      const remote=((snap.exists&&snap.data())||{}).list;
      if(!Array.isArray(remote)){ if(first&&WATCH.size) saveWatch(); first=false; return; }
      if(first){
        first=false;
        // union on the first sync so names added before db connected are not lost
        const before=WATCH.size; remote.forEach(t=>WATCH.add(t));
        if(WATCH.size!==before||remote.length!==WATCH.size) saveWatch();
      }else{
        WATCH=new Set(remote);
        try{ localStorage.setItem(WKEY,JSON.stringify([...WATCH])); }catch(e){}

}

function fillSection(s){

  const el=document.querySelector(`.sec[data-sec="${CSS.escape(s)}"] .secbody`);
  if(!el) return;
  const p=P(), idx=BYSEC.get(s)||[];
  const inWin=i=>ROWS[i].sig && ROWS[i].sig.ago<=p.recentWeeks;
  const byAgo=(a,b)=>(ROWS[a].sig?ROWS[a].sig.ago:9e9)-(ROWS[b].sig?ROWS[b].sig.ago:9e9);
  const hot=idx.filter(inWin).sort(byAgo);
  const rest=idx.filter(i=>!inWin(i)).sort(byAgo);
  // a sector with nothing recent has no "hot" view to show: opening it deliberately means
  // you want to look at the sector, so show the lot rather than an empty grid and a button
  const full=FULL.has(s)||hot.length===0;
  const want=full?'full':'hot';
  if(el.dataset.done===want) return;
  const show=full? hot.concat(rest) : hot;
  el.innerHTML=`<div class="grid">${show.map(i=>card(i,p)).join('')}</div>`
    +(full||rest.length===0?'':`<button class="more" data-full="${esc(s)}">显示该板块其余 ${rest.length} 只</button>`);
  el.dataset.done=want;
  el.querySelectorAll('.card').forEach(c=>c.addEventListener('click',ev=>{
    if(ev.target.closest('.star')) return;      // the star toggles, it does not open the chart
    open_(+c.dataset.i);
  }));
}

const DRAWS={};                                   // key `${ticker}|${tf}` -> array of shapes (kept in price/date space)
// drawings persist per viewer in this browser; storage can be unavailable (private window, blocked site data), so every access is guarded
const LSKEY='bursa_sector_draws_v1';
function loadDraws(){
  try{
    const raw=localStorage.getItem(LSKEY); if(!raw) return;
    const o=JSON.parse(raw); if(!o||typeof o!=='object') return;
    for(const k in o){                       // migrate old per-timeframe keys (`TICKER|w`) into one shared `TICKER`
      const t=k.split('|')[0];
      DRAWS[t]=(DRAWS[t]||[]).concat(o[k]||[]);
    }
  }catch(e){}
}
function cleanDraws(){ const k={}; for(const t in DRAWS) if(DRAWS[t]&&DRAWS[t].length) k[t]=DRAWS[t]; return k; }
function saveLocal(){ try{ localStorage.setItem(LSKEY,JSON.stringify(cleanDraws())); }catch(e){} }
function saveDraws(){
  saveLocal();
  if(DBDOC){ DBDOC.set(cleanDraws()).catch(()=>{}); }   // fire-and-forget; local copy already holds it
}
function countDraws(){ let n=0; for(const k in DRAWS) n+=(DRAWS[k]||[]).length; return n; }
loadDraws();

// ---- cross-device sync ---------------------------------------------------
// On the published artifact, drawings live in the artifact's own store so every
// device you sign in from sees the same lines. Opened as a local file there is no
// window.claude, so this quietly does nothing and localStorage remains the record.
let DBDOC=null, DBSYNCED=false;
async function initDB(){
  try{
    if(!window.claude||typeof window.claude.use!=='function') return;
    const db=await claude.use('db');
    if(!db) return;
    DBDOC=db.doc('sector_draws/all');
    let first=true;
    DBDOC.onSnapshot(snap=>{
      const remote=(snap.exists&&snap.data())||{};
      if(first){
        first=false;
        // union on the first sync so lines drawn on this device before it connected aren't lost
        let differs=false;
        for(const t in remote) if(Array.isArray(remote[t])){
          if(JSON.stringify(DRAWS[t]||[])!==JSON.stringify(remote[t])) differs=true;
          DRAWS[t]=remote[t];
        }
        for(const t in DRAWS) if(!(t in remote)) differs=true;
        if(differs) DBDOC.set(cleanDraws()).catch(()=>{});
      }else{
        for(const t in DRAWS) delete DRAWS[t];
        for(const t in remote) if(Array.isArray(remote[t])) DRAWS[t]=remote[t];
      }
      DBSYNCED=true; saveLocal();
      if($('modal')&&$('modal').classList.contains('on')) drawModal();
    },()=>{ DBDOC=null; });
  }catch(e){ DBDOC=null; }
}
initDB();


let MI=-1, MRANGE='260', MTOOL=null, PEND=null;
const RANGES=[{k:'260',t:'5年',n:260},{k:'all',t:'10年'}];
const dkey=()=>ROWS[MI].t;
function barsFor(d){ return d.w; }
function limitBars(){ const o=RANGES.find(x=>x.k===MRANGE); return (!o||o.k==='all')?99999:Math.max(12,o.n); }

let VIEW=null;
const MINBARS=15;
function curBars(){ return (MI>=0 && barsFor(ROWS[MI],MTF)) || []; }
function resetView(){
  const b=curBars(), lim=limitBars();
  const n=Math.min(b.length, lim===99999?b.length:lim);
  VIEW={i0:Math.max(0,b.length-n), i1:b.length};
}
function clampView(){
  const b=curBars(); if(!VIEW) return;
  let {i0,i1}=VIEW;
  let n=Math.max(MINBARS, Math.min(b.length, Math.round(i1-i0)));
  i0=Math.round(i0); i1=i0+n;
  if(i1>b.length){ i1=b.length; i0=Math.max(0,i1-n); }
  if(i0<0){ i0=0; i1=Math.min(b.length,n); }
  VIEW={i0,i1};
}
function zoomAt(fx,factor,fast){          // fx = 0..1 horizontal position inside the plot
  const b=curBars(); if(!VIEW||!b.length) return;
  const n=VIEW.i1-VIEW.i0;
  const anchor=VIEW.i0+fx*n;                       // bar index under the cursor, kept in place
  let nn=Math.round(n*factor);
  nn=Math.max(MINBARS, Math.min(b.length, nn));
  VIEW={i0:anchor-fx*nn, i1:anchor-fx*nn+nn};
  if(fast){ nudge(); return; }
  clampView(); drawModal();
}
function panBars(dBars){
  if(!VIEW) return;
  VIEW={i0:VIEW.i0+dBars, i1:VIEW.i1+dBars};
  clampView(); drawModal();
}


// ---- gestures ------------------------------------------------------------
// Pointer Events, not touch events. A touchscreen is a first-class pointer on every
// current browser, and one code path then covers finger, pen and mouse alike. The
// reason it matters: if the browser declines to synthesise touch events for a device,
// the page falls back to *compatibility* mouse events, which are only dispatched once
// the touch sequence has ended — the finger moves, nothing happens, then it jumps.
// pointerdown/move fire immediately regardless of input type, and setPointerCapture
// keeps the stream coming even though drawModal() replaces the <svg> mid-gesture.
// Registered ONCE at module scope: these used to sit inside open_(), so every card
// opened stacked another permanent copy.
const PTR=new Map();                 // live pointers: id -> {x,y}
let GEST=null, RAF=0;
// ?dbg=1 prints what actually fired, so a "feels slow" report can be measured
// instead of guessed at: input type, ms from press to first movement, ms per move.
let DBG=/[?&]dbg=1/.test(location.search);   // or press D — the query string does not
                                            // survive into the artifact's iframe
let dT=0,dN=0,dFirst=0,dKind='';
function chartRect(){
  const box=$('mchart'), svg=box&&box.querySelector('svg');
  const r=svg&&svg.getBoundingClientRect();
  return r&&r.width ? r : null;
}
const fxAt=(x,r)=>Math.max(0,Math.min(1,((x-r.left)/r.width*SC.W-SC.padL)/SC.pw));
const twoPtr=()=>{ const a=[...PTR.values()]; return a.length>=2?[a[0],a[1]]:null; };
const pDist=p=>Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);
const pMid =p=>(p[0].x+p[1].x)/2;
// One redraw per frame while dragging, and drawModal(true) skips the toolbar rebuild.
// The first move of a gesture draws synchronously — a frame of wait there reads as lag.
function nudge(now){
  if(now){
    if(RAF){ cancelAnimationFrame(RAF); RAF=0; }
    clampView(); drawModal(true); return;
  }
  if(RAF) return;
  RAF=requestAnimationFrame(()=>{ RAF=0; clampView(); drawModal(true); });
}
function startGesture(){
  GEST=null;
  const r=chartRect(); if(!r||!SC||!VIEW||!PTR.size) return;
  const n=VIEW.i1-VIEW.i0, two=twoPtr();
  if(two){
    const fx=fxAt(pMid(two),r);
    GEST={mode:'pinch', r:r, d0:pDist(two), n0:n, anchor:VIEW.i0+fx*n, moved:0};
  }else if(!MTOOL){                    // drawing mode owns single-pointer taps
    const p=[...PTR.values()][0], box=$('mchart').closest('.mbox');
    GEST={mode:'pan', x:p.x, y:p.y, i0:VIEW.i0, i1:VIEW.i1,
          perPx:n/(r.width*(SC.pw/SC.W)), box:box, top:box?box.scrollTop:0, axis:null, moved:0};
  }
}
function endGesture(){
  if(!GEST&&!PTR.size) return;
  GEST=null; PTR.clear();
  const m=$('mchart'); if(m) m.style.cursor='';
  drawModal();                                   // one full redraw to catch the chrome up
  if(DBG&&dN) $('mhint').innerHTML+=` <b style="color:#e8b339">[dbg ${dKind} · 首动 ${dFirst}ms ·`
    +` ${dN} 次移动 · ${Math.round((performance.now()-dT)/dN)}ms/次]</b>`;
  dN=0;
}
window.addEventListener('pointermove',e=>{
  if(!PTR.has(e.pointerId)) return;
  PTR.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(!GEST||!SC||!VIEW) return;
  if(DBG){ dN++; if(dN===1) dFirst=Math.round(performance.now()-dT); }
  if(GEST.mode==='pinch'){
    const two=twoPtr(); if(!two) return;
    const d=pDist(two); if(!d||!GEST.d0) return;
    const fx=fxAt(pMid(two),GEST.r);
    let nn=Math.round(GEST.n0*GEST.d0/d);        // fingers apart -> fewer bars -> zoom in
    nn=Math.max(MINBARS,Math.min(curBars().length,nn));
    VIEW={i0:GEST.anchor-fx*nn, i1:GEST.anchor-fx*nn+nn};
    nudge(!GEST.moved); GEST.moved=1;
    return;
  }
  const p=PTR.get(e.pointerId), dx=p.x-GEST.x, dy=p.y-GEST.y;
  if(!GEST.axis){                                // first real movement decides the axis
    if(Math.abs(dx)<2 && Math.abs(dy)<2) return;      // a tap stays a tap
    GEST.axis = Math.abs(dy)>Math.abs(dx)*1.2 ? 'y' : 'x';
  }
  if(GEST.axis==='y'){                           // touch-action:none, so scroll it ourselves
    if(GEST.box) GEST.box.scrollTop=GEST.top-dy; // 1:1 drag, no fling: the cost of owning the touch
    return;
  }
  VIEW={i0:GEST.i0-dx*GEST.perPx, i1:GEST.i1-dx*GEST.perPx};
  nudge(!GEST.moved); GEST.moved=1;
});
function liftPointer(e){
  if(!PTR.delete(e.pointerId)) return;
  if(PTR.size) startGesture();                   // 2 fingers -> 1: carry on panning
  else endGesture();
}
window.addEventListener('pointerup',liftPointer);
window.addEventListener('pointercancel',liftPointer);



function drawModal(fast){
  const d=ROWS[MI], s=d.sig, bars=d.w, box=$('mchart');
  if(!bars||!bars.length){ box.innerHTML=`<p class="note">没有可用的周线数据。</p>`; SC=null; return; }
  if(!VIEW) resetView(); else clampView();
  box.innerHTML=chart(bars,s,1150,470,true,'w',VIEW,DRAWS[dkey()]||[]);
  box.classList.toggle('draw',!!MTOOL);
  const shown=bars.slice(VIEW.i0,VIEW.i1).length;
  const nav='滚轮/双指缩放 · 拖拽平移 · 双击复位';
  $('mhint').innerHTML = s
    ? `周线 · 显示 ${shown}/${bars.length} 根K线 · 本股典型周振幅 <b>${d.wr}%</b>，本次站上支撑 <b>${(((s.rev-s.sup)/s.sup)*100).toFixed(1)}%</b> · ${nav}`
    : `周线 · 显示 ${shown}/${bars.length} 根K线 · 当前参数下无破底翻结构 · ${nav}`;
  if(fast) return;                                 // a pan/zoom changes none of the chrome below
  const rg=$('mrg');
  if(rg){
    // An option that already reaches past the data shows everything, so keep the FIRST such
    // one usable and grey only the ones beyond it. Without this an extra-tier stock (260
    // bars) greys out 5年 — the very option it is sitting on.
    let coveredAt=-1;
    RANGES.forEach((o,idx)=>{ if(coveredAt<0 && (o.k==='all'||o.n>=bars.length)) coveredAt=idx; });
    rg.innerHTML=RANGES.map((o,idx)=>{
      const dead = coveredAt>=0 && idx>coveredAt;
      return `<button data-rg="${o.k}"${dead?' disabled title="本股只有 '+bars.length+' 根周线（约 '+Math.round(bars.length/52)+' 年），此范围与更短的选项显示相同"':''}
        style="${dead?'opacity:.4;cursor:not-allowed':''}">${o.t}</button>`;
    }).join('');
    rg.querySelectorAll('button').forEach(b=>b.classList.toggle('on',MRANGE===b.dataset.rg));
  }
  document.querySelectorAll('#mtools button[data-tool]').forEach(b=>b.classList.toggle('on',MTOOL===b.dataset.tool));
  const dsv=$('dsave');
  if(dsv){
    const here=(DRAWS[dkey()]||[]).length;
    const where = DBSYNCED ? '云端同步（换设备也在）' : '⚠ 只存这台电脑·手机上看不到';
    dsv.textContent = here ? `已保存 ${here} 条 · ${where}` : `画的线会保存 · ${where}`;
  }
}

function pick(ev){
  const svg=$('mchart').querySelector('svg'); if(!svg||!SC||!SC.n) return null;
  const r=svg.getBoundingClientRect();
  if(!r.width||!r.height) return null;               // container collapsed / not laid out yet
  const vx=(ev.clientX-r.left)/r.width*SC.W, vy=(ev.clientY-r.top)/r.height*SC.H;
  const price=SC.lo+(1-(vy-SC.padT)/SC.ph)*(SC.hi-SC.lo);
  const pw=SC.W-SC.padL-SC.padR;
  let i=Math.round((vx-SC.padL)/(pw/SC.n)-0.5);
  if(!isFinite(i)||!isFinite(price)) return null;
  i=Math.max(0,Math.min(SC.n-1,i));
  const bar=SC.s[i]; if(!bar) return null;
  // Snap to this bar's open/high/low/close when the cursor is within a few pixels of one.
  // A support line drawn on a prior low should land ON the low, not near it.
  const tol=(SC.hi-SC.lo)*(7/SC.ph);
  let snap=price, snapTo=null;
  for(const kv of [['开',bar[1]],['高',bar[2]],['低',bar[3]],['收',bar[4]]]){
    if(Math.abs(price-kv[1])<=tol && (snapTo===null || Math.abs(price-kv[1])<Math.abs(price-snap))){
      snap=kv[1]; snapTo=kv[0];
    }
  }
  return {price, snap, snapTo, idx:i, date:bar[0]};
}
// ---- crosshair -----------------------------------------------------------
// Drawn into an overlay <svg> on top of the chart, never into the chart string: the chart
// is a rebuilt string, and re-rendering 500 bars per pointer move undoes the batching work.
function xhLayer(){
  const box=$('mchart'); if(!box||!SC) return null;
  let l=box.querySelector('.xh');
  if(!l){
    box.insertAdjacentHTML('beforeend',
      '<svg class="xh" viewBox="0 0 '+SC.W+' '+SC.H+'">'
      +'<line class="xv" stroke="var(--ink2)" stroke-width=".7" stroke-dasharray="3,3" opacity=".85"/>'
      +'<line class="xz" stroke="var(--ink2)" stroke-width=".7" stroke-dasharray="3,3" opacity=".85"/>'
      +'<rect class="xpb" width="52" height="16" rx="3"/>'
      +'<text class="xpt" font-size="11" text-anchor="middle" font-family="var(--mono)" font-weight="600"></text>'
      +'</svg><div class="xhbox"></div>');
    l=box.querySelector('.xh');
  }
  return l;
}
function hideXH(){
  const box=$('mchart'); if(!box) return;
  const l=box.querySelector('.xh'), t=box.querySelector('.xhbox');
  if(l) l.style.display='none';
  if(t) t.style.display='none';
}
function showXH(ev){
  const box=$('mchart'); if(!box||!SC) return;
  const svg=box.querySelector('svg'); if(!svg) return;
  const r=svg.getBoundingClientRect(); if(!r.width||!r.height) return;
  const p=pick(ev); if(!p) return;
  const l=xhLayer(); if(!l) return;
  const vx=(ev.clientX-r.left)/r.width*SC.W, vy=(ev.clientY-r.top)/r.height*SC.H;
  const x=Math.max(SC.padL,Math.min(SC.W-SC.padR,vx));
  const yc=Math.max(SC.padT,Math.min(SC.padT+SC.ph,vy));
  const shown=p.snapTo ? p.snap : SC.lo+(1-(yc-SC.padT)/SC.ph)*(SC.hi-SC.lo);
  const y=SC.padT+(1-(shown-SC.lo)/(SC.hi-SC.lo))*SC.ph;
  const q=function(sel,a,v){ l.querySelector(sel).setAttribute(a,v); };
  q('.xv','x1',x); q('.xv','x2',x); q('.xv','y1',SC.padT); q('.xv','y2',SC.padT+SC.ph);
  q('.xz','y1',y.toFixed(1)); q('.xz','y2',y.toFixed(1)); q('.xz','x1',SC.padL); q('.xz','x2',SC.W-SC.padR);
  q('.xpb','x',SC.W-SC.padR+1); q('.xpb','y',(y-8).toFixed(1)); q('.xpb','fill',p.snapTo?'#e8b339':'var(--ink2)');
  q('.xpt','x',SC.W-SC.padR+27); q('.xpt','y',(y+4).toFixed(1)); q('.xpt','fill','var(--bg)');
  l.querySelector('.xpt').textContent=shown.toFixed(3);
  l.style.display='block';
  const b=SC.s[p.idx], t=box.querySelector('.xhbox');
  if(b&&t){
    const up=b[4]>=b[1];
    t.innerHTML=b[0]+' &nbsp;开 '+b[1].toFixed(3)+' &nbsp;高 '+b[2].toFixed(3)+' &nbsp;低 '+b[3].toFixed(3)
      +' &nbsp;<b style="color:'+(up?'var(--up)':'var(--dn)')+'">收 '+b[4].toFixed(3)+'</b>'
      +(p.snapTo ? ' &nbsp;· <span class="sn">吸附 '+p.snapTo+' '+p.snap.toFixed(3)+'</span>'
                 : ' &nbsp;· 光标 '+shown.toFixed(3));
    t.style.display='block';
  }
}

function onChartClick(ev){

  if(!MTOOL||!SC) return;
  const p=pick(ev); if(!p) return;
  const key=dkey(); DRAWS[key]=DRAWS[key]||[];
  if(MTOOL==='h'){ DRAWS[key].push({k:'h',y:p.snap}); }
  else {
    if(!PEND){ PEND={d:p.date,y:p.snap}; $('mhint').innerHTML='趋势线：已选起点，再点一次选终点（按 Esc 取消）。'; return; }
    DRAWS[key].push({k:'t',d1:PEND.d,y1:PEND.y,d2:p.date,y2:p.snap}); PEND=null;
  }
  saveDraws();
  drawModal();
}


function open_(i){
  MI=i; MRANGE='260'; MTOOL=null; PEND=null;
  const d=ROWS[i],s=d.sig,p=P();
  $('mtitle').innerHTML=`<div style="font-size:19px;font-weight:600">${esc(d.n)}</div>
    <div class="sy" style="margin-top:3px">${d.sym} · ${esc(d.s)}${d.i?' · '+esc(d.i):''} · 典型周振幅 ${d.wr}%</div>`;
  $('mbody').innerHTML=`
    <div id="mtf" class="tfbar">
      <span style="font-size:12.5px;color:var(--ink3)">周线</span>
      <span class="sep"></span>
      <span id="mrg" style="display:inline-flex;gap:5px"></span>
      <a class="tvbtn" style="margin-left:auto" target="_blank" rel="noopener"
         href="https://www.tradingview.com/chart/?symbol=MYX%3A${encodeURIComponent(d.t)}">📈 TradingView 看日线</a>
    </div>
    <div id="mtools" class="tfbar">
      <button class="tool" data-tool="h">━ 画横线</button>
      <button class="tool" data-tool="t">◣ 画趋势线</button>
      <button data-zoom="out">➖</button><button data-zoom="in">➕</button><button data-zoom="0">⟲ 复位</button>
      <span class="sep"></span>
      <button data-clear="1">🗑 清除全部</button>
      <span id="dsave" style="font-size:11px;color:var(--ink3);font-family:var(--mono)"></span>
    </div>
    <div class="cv" id="mchart"></div>
    <p class="note" id="mhint" style="margin-top:4px"></p>
    ${s?`<div class="st" style="font-size:13px;gap:20px;margin-top:10px;flex-wrap:wrap">
      <span><b>支撑价</b>${f2(s.sup)}</span>
      <span><b>首次跌破</b>${s.breakDate}</span>
      <span><b>打底最低</b><i class="r" style="font-style:normal">${f2(s.low)}</i> <span style="color:var(--ink3)">(${s.lowDate})</span></span>
      <span><b>反转收盘</b><i class="g" style="font-style:normal">${f2(s.rev)}</i> <span style="color:var(--ink3)">(${s.revDate})</span></span>
      <span><b>打底</b>${s.base} 周</span>
      <span style="color:var(--ink3)">${s.ago===0?'本周':s.ago+' 周前'}</span>
    </div>
    <p class="note">结构：先跌破前 ${p.supportWeeks} 周最低价 ${f2(s.sup)}（${s.breakDate} 首次跌破），打底 ${s.base} 周期间最低下探 ${f2(s.low)}（未再明显创新低），
    随后于 ${s.revDate} 当周收在 ${f2(s.rev)}，站上支撑 ${(((s.rev-s.sup)/s.sup)*100).toFixed(1)}%，确认反转。
    本股典型周振幅 ${d.wr}%——站上幅度若与振幅相当或更小，这根反转的说服力就有限。</p>`:'<p class="note">当前参数下这只股票没有符合的破底翻结构。改一下上方参数，或者直接看图。</p>'}`;
  $('mtf').addEventListener('click',e=>{
    const b=e.target.closest('button'); if(!b||b.disabled) return;
    if(b.dataset.rg) MRANGE=b.dataset.rg;
    PEND=null; resetView(); drawModal();
  });
  $('mtools').addEventListener('click',e=>{
    const b=e.target.closest('button'); if(!b) return;
    if(b.dataset.zoom!==undefined){
      if(b.dataset.zoom==='0') resetView(); else zoomAt(0.5, b.dataset.zoom==='in' ? 1/1.4 : 1.4);
      drawModal(); return;
    }
    if(b.dataset.clear){ DRAWS[dkey()]=[]; MTOOL=null; PEND=null; saveDraws(); }
    else { MTOOL = MTOOL===b.dataset.tool ? null : b.dataset.tool; PEND=null; }
    drawModal();
  });
  const mc=$('mchart');
  mc.addEventListener('click',onChartClick);
  mc.addEventListener('dblclick',()=>{ resetView(); drawModal(); });
  mc.addEventListener('pointermove',showXH);
  mc.addEventListener('pointerleave',hideXH);

  mc.addEventListener('wheel',e=>{
    if(!SC) return;
    e.preventDefault();
    const r=chartRect(); if(!r) return;
    zoomAt(fxAt(e.clientX,r), e.deltaY>0 ? 1.18 : 1/1.18, true);
  },{passive:false});
  mc.addEventListener('pointerdown',e=>{
    if(e.pointerType==='mouse' && e.button!==0) return;
    PTR.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(DBG && PTR.size===1){ dT=performance.now(); dN=0; dFirst=0; dKind=e.pointerType; }
    startGesture();
    if(GEST){
      try{ mc.setPointerCapture(e.pointerId); }catch(_){}   // survive the <svg> being replaced
      if(e.pointerType==='mouse') mc.style.cursor='grabbing';
    }
  });
  resetView();
  drawModal();
  $('modal').classList.add('on');
}
$('mclose').onclick=()=>$('modal').classList.remove('on');
$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').classList.remove('on')};
document.addEventListener('keydown',e=>{
  if((e.key==='d'||e.key==='D') && !/^(INPUT|TEXTAREA)$/.test((e.target||{}).tagName||'')){
    DBG=!DBG;
    if($('mhint')) $('mhint').innerHTML+=` <b style="color:#e8b339">[dbg ${DBG?'已开启，拖一次图表看读数':'已关闭'}]</b>`;
    return;
  }
  if(e.key!=='Escape') return;
  if(PEND){ PEND=null; drawModal(); return; }
  if(MTOOL){ MTOOL=null; drawModal(); return; }
  $('modal').classList.remove('on');
});

$('secs').addEventListener('click',e=>{
  const st=e.target.closest('.star');
  if(st){ const c=st.closest('.card'); if(c) toggleWatch(ROWS[+c.dataset.i].t); return; }

  const more=e.target.closest('.more');
  if(more){ FULL.add(more.dataset.full); fillSection(more.dataset.full); return; }
  const hd=e.target.closest('.sechd'); if(!hd) return;
  const sec=hd.parentElement, name=sec.dataset.sec;
  if(sec.classList.toggle('open')){ OPEN.add(name); fillSection(name); }
  else OPEN.delete(name);
});
$('watchsec').addEventListener('click',e=>{
  const st=e.target.closest('.star');
  if(st){ const c=st.closest('.card'); if(c) toggleWatch(ROWS[+c.dataset.i].t); }
});

// ---- search: ticker, Bursa code or name -> add to the watchlist -----------
// Matches only what the board already carries. A name that is not one of the embedded
// stocks cannot be charted here, so it is not offered rather than added as a dead entry.
let HSEL=-1;
function hits(){
  const q=$('q').value.trim().toLowerCase();
  const box=$('hits');
  if(q.length<1){ box.classList.remove('on'); box.innerHTML=''; HSEL=-1; return; }
  const out=[];
  for(let i=0;i<ROWS.length&&out.length<10;i++){
    const d=ROWS[i];
    const hay=(d.t+' '+d.sym+' '+d.n).toLowerCase();
    if(hay.includes(q)) out.push(i);
  }
  if(!out.length){
    box.innerHTML=`<div class="hit" style="color:var(--ink3);cursor:default">没有匹配。本看板收录市值 1 亿以上的马股；更小的仙股周线断续，形态算不出有意义的结果，故未收录。</div>`;
    box.classList.add('on'); HSEL=-1; return;
  }
  HSEL=0;
  box.innerHTML=out.map((i,k)=>{
    const d=ROWS[i];
    return `<div class="hit${k===0?' sel':''}" data-i="${i}">
      ${WATCH.has(d.t)?'<span class="on2">已在清单</span>':''}
      <b>${esc(d.t)}</b>${esc(d.n)}<i>${d.sym} · ${esc(d.s)}${d.i?' · '+esc(d.i):''}${d.x?' · 板块列表外':''}</i></div>`;
  }).join('');
  box.classList.add('on');
}
function pickHit(i){
  if(i==null||i<0) return;
  toggleWatch(ROWS[i].t);
  $('q').value=''; $('hits').classList.remove('on'); $('hits').innerHTML=''; HSEL=-1;
}
$('q').addEventListener('input',hits);
$('q').addEventListener('keydown',e=>{
  const items=[...$('hits').querySelectorAll('.hit[data-i]')];
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){
    if(!items.length) return;
    e.preventDefault();
    HSEL=(HSEL+(e.key==='ArrowDown'?1:items.length-1))%items.length;
    items.forEach((el,k)=>el.classList.toggle('sel',k===HSEL));
    items[HSEL].scrollIntoView({block:'nearest'});
  }else if(e.key==='Enter'){
    e.preventDefault();
    if(items[HSEL]) pickHit(+items[HSEL].dataset.i);
  }else if(e.key==='Escape'){
    $('q').value=''; $('hits').classList.remove('on'); HSEL=-1;
  }
});
$('hits').addEventListener('click',e=>{
  const h=e.target.closest('.hit[data-i]'); if(h) pickHit(+h.dataset.i);
});
document.addEventListener('click',e=>{
  if(!e.target.closest('.find')) $('hits').classList.remove('on');
});

$('expall').onclick=
()=>{ COLLAPSED=false; BYSEC.forEach((v,k)=>OPEN.add(k)); FULL.clear(); render(); };
$('colall').onclick=()=>{ COLLAPSED=true; OPEN.clear(); render(); };
['p_sup','p_min','p_max','p_tol','p_reb','p_rec'].forEach(id=>$(id).addEventListener('change',()=>{
  document.querySelectorAll('.secbody').forEach(b=>delete b.dataset.done);
  render();
}));
$('theme').onclick=()=>{
  const r=document.documentElement;
  r.dataset.theme = r.dataset.theme==='light' ? 'dark' : 'light';
};
render();
})();
