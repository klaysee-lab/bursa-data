<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found]){display:none!important}</style></head><body>
<title>马股板块破底翻监控</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0f14; --card:#131820; --card2:#0f141b; --bd:#232c38; --bd2:#2d3846;
    --ink:#e8eef6; --ink2:#9fb0c4; --ink3:#6b7d92;
    --up:#26a69a; --dn:#ef5350; --sup:#f2555a; --rev:#3fc98a;
    --hl:#2ea043; --btn:#1f6feb; --hlbg:rgba(46,160,67,.07);
    --mono:'IBM Plex Mono','Consolas',monospace; --body:'IBM Plex Sans','Segoe UI',system-ui,sans-serif;
  }
  :root[data-theme="light"]{
    --bg:#f2f5f9; --card:#fff; --card2:#f7f9fc; --bd:#d9e1ec; --bd2:#c4cfdd;
    --ink:#101720; --ink2:#4a5a6e; --ink3:#7b8ca1; --hlbg:rgba(46,160,67,.09);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px}
  .mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
  .wrap{max-width:1980px;margin:0 auto;padding:16px 20px 40px}

  .top{display:flex;gap:20px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;margin-bottom:10px}
  h1{margin:0;font-size:23px;font-weight:700;letter-spacing:.01em}
  h1 .pre{font-family:var(--mono);font-size:13px;color:var(--ink3);font-weight:500;margin-right:6px}
  .sub{margin:5px 0 0;color:var(--ink2);font-size:12.5px;max-width:70ch}
  .ctrl{display:flex;gap:9px;align-items:flex-end;flex-wrap:wrap}
  .fld{display:flex;flex-direction:column;gap:4px}
  .fld label{font-size:10.5px;color:var(--ink3);white-space:nowrap}
  .fld input[type=number]{width:86px;background:var(--card);border:1px solid var(--bd);color:var(--ink);
    border-radius:6px;padding:7px 9px;font-family:var(--mono);font-size:13px}
  .fld input:focus{outline:2px solid var(--btn);outline-offset:-1px}
  .scope{display:flex;flex-direction:column;gap:4px}
  .scope .row{display:flex;gap:6px}
  .chk{display:flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--bd);
    border-radius:6px;padding:7px 11px;cursor:pointer;font-size:12.5px;white-space:nowrap}
  .chk input{accent-color:var(--btn);width:14px;height:14px;cursor:pointer}
  #rescan{background:var(--btn);border:none;color:#fff;border-radius:7px;padding:9px 16px;
    font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;font-family:var(--body)}
  #rescan:hover{filter:brightness(1.12)}
  #themeBtn{background:var(--card);border:1px solid var(--bd);color:var(--ink2);border-radius:7px;
    padding:9px 12px;font-size:13px;cursor:pointer}
  .btn2{background:var(--card);border:1px solid var(--bd);color:var(--ink2);border-radius:7px;
    padding:9px 12px;font-size:12.5px;cursor:pointer;font-family:var(--body);white-space:nowrap}
  .btn2:hover{border-color:var(--bd2);color:var(--ink)}
  #refresh{background:var(--btn);border-color:var(--btn);color:#fff;font-weight:600}
  #refresh:hover{filter:brightness(1.12);color:#fff}
  #refresh:disabled{opacity:.55;cursor:progress}
  #rfmsg{align-self:center;font-family:var(--mono);font-size:11px;color:var(--ink3);
    max-width:36ch;line-height:1.35}

  .legend{display:flex;gap:16px;flex-wrap:wrap;font-size:11.5px;color:var(--ink2);margin:10px 0 4px;align-items:center}
  .legend i{display:inline-block;margin-right:5px;vertical-align:middle}
  .dot{width:8px;height:8px;border-radius:50%}
  .dash{width:16px;height:0;border-top:2px dashed var(--sup)}
  .parms{font-family:var(--mono);font-size:11px;color:var(--ink3);margin:0 0 14px}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(430px,1fr));gap:14px}
  .card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:13px 15px 11px;cursor:pointer;
    transition:border-color .12s,transform .12s}
  .card:hover{border-color:var(--bd2);transform:translateY(-1px)}
  .card.hot{border-color:var(--hl);background:linear-gradient(var(--hlbg),var(--hlbg)),var(--card);box-shadow:0 0 0 1px var(--hl) inset}
  .ch{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .nm{font-size:15px;font-weight:600;line-height:1.25}
  .sy{font-family:var(--mono);font-size:11px;color:var(--ink3);margin-top:2px}
  .rt{display:flex;align-items:center;gap:7px;flex-shrink:0}
  .ago{font-family:var(--mono);font-size:11px;background:var(--card2);border:1px solid var(--bd);
    color:var(--ink2);border-radius:5px;padding:3px 8px;white-space:nowrap}
  .card.hot .ago{background:rgba(46,160,67,.16);border-color:var(--hl);color:#7ee2a8}
  :root[data-theme="light"] .card.hot .ago{background:rgba(46,160,67,.14);color:#1a7f37;font-weight:600}
  /* 「刚发生」的卡片：整张点亮 —— 绿边 + 底色 + 左侧粗条，扫一眼就跳出来。
     十年内曾出现过的有 665/666 只，全部标记等于没标记，所以只标记落在
     「刚发生」窗口内的那些；更早的靠右上角的「N 周前」自己说话。 */
  .card.hot{border-left-width:3px;
    box-shadow:0 0 0 1px var(--hl) inset, 0 0 16px rgba(46,160,67,.20)}
  .card.hot .nm{color:#8ff0b6}
  :root[data-theme="light"] .card.hot .nm{color:#116329}
  /* 图例的小圆点原本没给颜色，是三个透明方块 */
  .legend .dot{background:var(--rev)}
  .legend .dot.g{background:var(--hl)}
  .legend .dot.r{background:var(--sup)}
  /* 切主题后卡片边框会卡在旧主题的颜色：border-color 上挂着 transition，
     而它的值来自 CSS 变量——变量改了不会触发过渡重算，边框就停在原色。
     去掉这段过渡即可（hover 换边框本来也不需要动画）。 */
  .card{transition:transform .12s}
  /* 日图确认的小标签 */
  .dc{font-family:var(--mono);font-size:10.5px;padding:2px 7px;border-radius:5px;white-space:nowrap;
    background:var(--card2);border:1px solid var(--bd);color:var(--ink2)}
  .dc.ok{background:rgba(46,160,67,.16);border-color:var(--hl);color:#7ee2a8}
  :root[data-theme="light"] .dc.ok{color:#1a7f37;font-weight:600}
  .dc.wait{border-color:#6b5320;color:#e8b339}
  .dc.bad{border-color:#6b2b2d;color:var(--sup)}
  /* 回踩区间的价位：红底，跟图上那个红色虚线框对上 */
  .bandpx{background:rgba(242,85,90,.16);border:1px solid var(--sup);color:var(--sup);
    border-radius:4px;padding:1px 7px;font-family:var(--mono);font-weight:600;white-space:nowrap}
  .st .bandpx, .note .bandpx{color:var(--sup)}   /* .st span 的红色会被覆盖，提高一点权重 */
  :root[data-theme="light"] .bandpx{background:rgba(242,85,90,.12)}
  .tv{opacity:.5;text-decoration:none;font-size:13px;line-height:1}
  /* 日图结果面板：跟板块用同一套折叠件，只是边框换个颜色好区分 */
  #dayres{margin-bottom:14px}
  #dayres .sec{border-color:var(--bd2)}
  #dayres .sechd .cnt{margin-left:auto}
  .cp{background:var(--card);border:1px solid var(--bd);color:var(--ink2);border-radius:6px;
    padding:4px 9px;font-size:11px;cursor:pointer;margin-left:10px;font-family:var(--body);white-space:nowrap}
  .cp:hover{border-color:var(--btn);color:var(--ink)}
  .tks{display:flex;flex-wrap:wrap;gap:6px;padding:2px 0 8px}
  .tk{background:var(--card);border:1px solid var(--bd);color:var(--ink2);border-radius:5px;
    padding:4px 9px;font-family:var(--mono);font-size:11.5px;cursor:pointer}
  .tk:hover{border-color:var(--btn);color:var(--ink)}
  .drhd{font-family:var(--mono);font-size:11.5px;color:var(--ink3);margin:0 0 7px}
  /* 状态芯片：一行看完全部分组，点一下展开并跳过去 */
  .dchips{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 9px}
  .dchip{background:var(--card);border:1px solid var(--bd);color:var(--ink2);border-radius:16px;
    padding:4px 12px;font-size:12px;cursor:pointer;font-family:var(--body);white-space:nowrap}
  .dchip:hover{border-color:var(--btn);color:var(--ink)}
  .dchip b{font-family:var(--mono);margin-left:5px}
  .dchip.on{border-color:var(--btn);color:var(--ink);background:var(--card2)}
  .dchip.g-in{border-color:var(--hl);color:#7ee2a8}
  .dchip.g-fail{border-color:#6b2b2d;color:var(--sup)}
  .dchip.g-deep,.dchip.g-pwait,.dchip.g-wait{border-color:#6b5320;color:#e8b339}
  :root[data-theme="light"] .dchip.g-in{color:#1a7f37}
  .tv:hover{opacity:1}
  .cv{margin:8px 0 7px;position:relative}
  .cv svg{display:block;width:100%;height:auto}
  /* none, not pan-y: with pan-y the browser must first decide scroll-vs-page and holds
     the gesture back for ~8px of finger travel, which reads as "nothing happens yet".
     We own every touch here and scroll .mbox ourselves on a vertical swipe. */
  #mchart,#mchart svg{touch-action:none}
  .st{display:flex;gap:14px;flex-wrap:wrap;font-family:var(--mono);font-size:11.5px;
      border-top:1px solid var(--bd);padding-top:8px}
  .st b{color:var(--ink3);font-weight:400;margin-right:4px;font-size:10.5px}
  .st span{color:var(--ink);white-space:nowrap}
  .st .r{color:var(--sup)} .st .g{color:var(--rev)}
  /* 突破的那根日线 —— 这是整块看板的落点，所以给它自己一条绿框 */
  .dbar{margin-top:9px;border:1px solid var(--bd2);border-radius:8px;background:var(--card2);
    padding:8px 11px;display:flex;gap:8px 15px;align-items:center;flex-wrap:wrap;
    font-family:var(--mono);font-size:11.5px}
  .dbar.hit{border-color:var(--rev);background:rgba(63,201,138,.08)}
  .dbar .lab{font-family:var(--body);font-size:11.5px;color:var(--ink3)}
  .dbar .tm{font-weight:600;color:var(--rev);font-size:13px}
  .dbar b{color:var(--ink3);font-weight:400;font-size:10.5px;margin-right:3px}
  .dbtn{margin-left:auto;background:var(--btn);border:none;color:#fff;border-radius:6px;
    padding:6px 13px;font-size:12px;font-weight:600;cursor:pointer;font-family:var(--body);white-space:nowrap}
  .dbtn:hover{filter:brightness(1.12)}
  /* 收盘扫描留下的通知 —— 桌面弹窗看漏了，打开看板还能补看 */
  .abar{border:1px solid var(--rev);border-radius:10px;background:rgba(63,201,138,.09);
    padding:11px 14px;margin:0 0 12px;display:flex;gap:10px 14px;align-items:flex-start;flex-wrap:wrap}
  .abar .ah{font-weight:600;color:var(--rev);font-size:13.5px;width:100%}
  .abar .al{font-family:var(--mono);font-size:12px;color:var(--ink);width:100%;line-height:1.75}
  .abar .al i{font-style:normal;color:var(--ink3)}
  .abar .ax{margin-left:auto;background:transparent;border:1px solid var(--bd2);color:var(--ink2);
    border-radius:6px;padding:4px 10px;font-size:11.5px;cursor:pointer;font-family:var(--body)}
  .abar .ax:hover{border-color:var(--rev);color:var(--rev)}
  .empty{color:var(--ink3);padding:40px 4px;font-size:13.5px;grid-column:1/-1}

  .modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;
    justify-content:center;z-index:99;padding:24px}
  .modal.on{display:flex}
  .mbox{background:var(--card);border:1px solid var(--bd2);border-radius:12px;padding:20px 22px;
    max-width:1200px;width:100%;max-height:92vh;overflow:auto}
  .mtop{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;gap:16px}
  .mx{background:none;border:none;color:var(--ink2);font-size:24px;cursor:pointer;line-height:1;padding:0 4px}
  .note{font-size:11.5px;color:var(--ink3);font-family:var(--mono);margin-top:12px;line-height:1.6}
  .tfbar{display:flex;gap:5px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
  .tfbar button{background:var(--card2);border:1px solid var(--bd);color:var(--ink2);border-radius:6px;
    padding:6px 15px;font-size:12.5px;cursor:pointer;font-family:var(--body)}
  .tfbar button:hover{border-color:var(--bd2)}
  .tfbar button.on{background:var(--btn);border-color:var(--btn);color:#fff;font-weight:600}
  .tfbar .sep{width:1px;height:22px;background:var(--bd);margin:0 5px}
  .tool.on{background:var(--sup);border-color:var(--sup);color:#fff;font-weight:600}
  #mchart{position:relative;cursor:grab}
  #mchart.draw{cursor:default}
  #mchart.draw svg{cursor:crosshair}
  .tvbtn{display:inline-flex;align-items:center;gap:6px;background:var(--card2);border:1px solid var(--bd);
    color:var(--ink2);border-radius:6px;padding:6px 11px;font-size:12px;text-decoration:none}
  .tvbtn:hover{border-color:var(--bd2);color:var(--ink)}

  /* ---- sector board additions ---- */
  .sec{border:1px solid var(--bd);border-radius:10px;margin-bottom:10px;background:var(--card2);overflow:hidden}
  .sechd{display:flex;align-items:center;gap:12px;padding:11px 14px;cursor:pointer;user-select:none}
  .sechd:hover{background:var(--card)}
  .sechd .chev{color:var(--ink3);font-size:11px;width:10px;transition:transform .15s}
  .sec.open .sechd .chev{transform:rotate(90deg)}
  /* 结构说明的折叠件：跟板块列表用同一个 ▶ 语言 */
  .ndetail .nhd{display:inline-flex;align-items:center;gap:6px;cursor:pointer;user-select:none;
    color:var(--ink2);font-size:12.5px;margin-top:9px}
  .ndetail .nhd:hover{color:var(--ink)}
  .ndetail .nhd .chev{color:var(--ink3);font-size:11px;display:inline-block;transition:transform .15s}
  .ndetail.open .nhd .chev{transform:rotate(90deg)}
  .ndetail .nbody{display:none;margin-top:5px}
  .ndetail.open .nbody{display:block}
  .sechd .nm{font-weight:600;font-size:14.5px}
  .sechd .cnt{font-family:var(--mono);font-size:11.5px;color:var(--ink3)}
  .sechd .hot{background:var(--hlbg);border:1px solid var(--hl);color:var(--hl);
    border-radius:20px;padding:1px 9px;font-family:var(--mono);font-size:11px;font-weight:600}
  .secbody{display:none;padding:0 12px 12px}
  .sec.open .secbody{display:block}
  .more{background:none;border:1px dashed var(--bd2);color:var(--ink2);border-radius:8px;
    padding:8px 0;width:100%;cursor:pointer;font-family:var(--body);font-size:12.5px;margin-top:8px}
  .more:hover{color:var(--ink);border-color:var(--btn)}
  /* weekly range % — the number that says whether "reclaimed by 2%" means anything on this stock */
  .wr{font-family:var(--mono);font-size:10.5px;padding:1px 6px;border-radius:4px;
    background:var(--card2);border:1px solid var(--bd);color:var(--ink3);white-space:nowrap}
  .wr.hi{color:#e8b339;border-color:#6b5320}
  #mchart,#mchart svg{touch-action:none}
  /* the crosshair lives in its own overlay so a pointer move never re-renders the chart */
  #mchart .xh{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;display:none}
  #mchart .xhbox{position:absolute;left:8px;top:6px;pointer-events:none;display:none;
    font-family:var(--mono);font-size:11px;color:var(--ink2);white-space:nowrap;
    background:var(--card2);border:1px solid var(--bd);border-radius:5px;padding:3px 8px}
  #mchart .xhbox .sn{color:#e8b339;font-weight:600}
  /* ---- watchlist + search ---- */
  .find{position:relative}
  .find input{width:230px;background:var(--card);border:1px solid var(--bd);color:var(--ink);
    border-radius:6px;padding:7px 9px;font-size:13px;font-family:var(--body)}
  .find input:focus{outline:2px solid var(--btn);outline-offset:-1px}
  .hits{position:absolute;top:100%;left:0;z-index:40;margin-top:4px;width:330px;max-height:300px;overflow:auto;
    background:var(--card);border:1px solid var(--bd2);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.4);display:none}
  .hits.on{display:block}
  .hit{padding:7px 11px;cursor:pointer;font-size:12.5px;border-bottom:1px solid var(--bd)}
  .hit:last-child{border-bottom:none}
  .hit:hover,.hit.sel{background:var(--card2)}
  .hit b{font-family:var(--mono);margin-right:7px}
  .hit i{font-style:normal;color:var(--ink3);font-size:11px;display:block;margin-top:1px}
  .hit .on2{color:var(--hl);font-size:11px;float:right}
  .star{background:none;border:none;cursor:pointer;font-size:14px;line-height:1;padding:2px 3px;
    color:var(--ink3);opacity:.55}
  .star:hover{opacity:1}
  .star.on{color:#e8b339;opacity:1}
  #watchsec .sec{border-color:#6b5320}
  #watchsec .sechd .nm{color:#e8b339}


</style>

<div class="wrap">
  <div class="top">
    <div>
      <h1><span class="pre">MY</span>马股板块「破底翻」监控</h1>
      <p class="sub">Bursa 13 个板块 · 市值 1 亿以上的马股全部列出，龙头与二线一起扫 · 跌破前低后打底数周、未再破新低，再明显拉回反转
        <span class="mono" style="color:var(--ink3)">· 构建 <b id="build"></b></span></p>
    </div>
    <div class="ctrl">
      <div class="fld"><label>支撑观察(周)</label><input type="number" id="p_sup" value="52" min="4" max="52"></div>
      <div class="fld"><label>最长等待(周)</label><input type="number" id="p_max" value="12" min="1" max="40"></div>
      <div class="fld"><label>容忍再深跌(%)</label><input type="number" id="p_tol" value="2" step="0.5" min="0" max="20"></div>
      <div class="fld"><label>突破幅度(%)</label><input type="number" id="p_reb" value="2" step="0.5" min="0" max="30"></div>
      <div class="fld"><label>振幅倍数</label><input type="number" id="p_volk" value="0.6" step="0.1" min="0" max="3"></div>
      <div class="fld"><label>最少跳动(跳)</label><input type="number" id="p_tk" value="2" min="0" max="10"></div>
      <div class="fld"><label>日图确认(日)</label><input type="number" id="p_day" value="3" min="1" max="10"></div>
      <div class="fld"><label>回踩幅度(%)</label><input type="number" id="p_pb" value="4" step="0.5" min="0" max="20"></div>
      <div class="fld"><label>回踩窗口(日)</label><input type="number" id="p_pbd" value="10" min="1" max="60"></div>
      <div class="fld"><label>「刚发生」(周)</label><input type="number" id="p_rec" value="4" min="1" max="52"></div>
      <div class="fld find"><label>搜寻股票（代码或名称）</label>
        <input type="text" id="q" placeholder="例：MAYBANK 或 1155 或 Public" autocomplete="off">
        <div class="hits" id="hits"></div></div>
      <button class="btn2" id="dayall" title="对所有「刚发生」的股票跑一遍日图确认">✓ 日图确认</button>
      <button class="btn2" id="expall">展开全部</button>
      <button class="btn2" id="colall">收起全部</button>
      <button class="btn2" id="theme">◐</button>
      <button class="btn2" id="refresh" title="从 Yahoo Finance 重新抓取全部周线（需用「启动.bat」打开本页）">⟳ 刷新数据</button>
      <span id="rfmsg"></span>
    </div>
  </div>

  <div class="legend">
    <span><i class="dot g"></i>刚发生的突破（默认 4 周内，所在板块自动展开）</span>
    <span><i class="dot r"></i>破 = 破低那根周K（H / L 就是它的最高价和最低价）</span>
    <span><i class="dot"></i>翻 = 那一周之内摸到了突破线（具体哪一天由日图定）</span>
    <span><i class="dash"></i>支撑价 · <i class="dash" style="border-top-color:var(--rev)"></i>突破线（破低周收盘 +3% 或 +2 跳，不低于支撑价）· <i class="dash" style="border-top-color:#e8b339"></i>最高价 H · <i class="dash" style="border-top-color:#9b8cff"></i>最低价 L</span>
    <span style="color:var(--ink3)">虚线框 = 回踩区间（下沿 支撑价 −2%，上沿 (H+支撑价)/2 +2%）· 日线 3/3 = 突破日之后连续 3 日收盘守住支撑价</span>
  </div>
  <p class="parms" id="parms"></p>
  <div id="alertbar"></div>
  <div id="dayres"></div>
  <div id="findsec"></div>
  <div id="watchsec"></div>
  <div id="secs"></div>
  <p class="note" id="foot"></p>
</div>

<div class="modal" id="modal"><div class="mbox">
  <div class="mtop"><div id="mtitle"></div><button class="mx" id="mclose">&times;</button></div>
  <div id="mbody"></div>
</div></div>

<script>
(function(){
let DATA = __DATA__;
let SNAP = "__SNAP__";
const $=id=>document.getElementById(id);
// 价格显示：去掉没意义的末位 0（1.060 → 1.06），但至少留两位小数（64.000 → 64.00），
// 而 0.185、1.715 这种带真实第三位的照原样留着——回踩区间的边界就靠这一位。
const f2=n=>{
  if(n==null) return '—';
  let s=(Math.round(n*1000)/1000).toFixed(3).replace(/(\.\d*?)0+$/,'$1');
  if(s.endsWith('.')) s+='00';
  else if(/\.\d$/.test(s)) s+='0';
  return s;
};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// Bursa 的最小跳动：RM1 以下 0.005，RM1-10 0.01，RM10-100 0.02，再上去 0.10。
// 百分比在低价股上会失效——0.15 的股票 +3% 只有 0.0045，连一个跳动都不到，
// 所以突破线还要跨过「至少 N 个跳动」这道底，两者取高。
const TICK=p=> p<1 ? 0.005 : p<10 ? 0.01 : p<100 ? 0.02 : 0.10;
// 对齐到「最近」的可成交价位：离下一格近就往上，离上一格近就往下。
// 1.092 在 0.01 的格子上 → 第三位是 2，不到半格，往下对到 1.09；1.096 → 往上对到 1.10。
// 刚好落在半格上（1.095）按惯例往上。
const snapTick=p=>{ const t=TICK(p); return Math.round(Math.round(p/t)*t*1e5)/1e5; };
function P(){return{
  supportWeeks:+$('p_sup').value||52, maxWait:+$('p_max').value||12,
  tolPct:+$('p_tol').value||0, breakPct:+$('p_reb').value||0, breakTicks:+$('p_tk').value||0,
  dayN:+$('p_day').value||3, pbPct:+$('p_pb').value||0, pbDays:+$('p_pbd').value||10,
  volK:+$('p_volk').value||0,
  recentWeeks:+$('p_rec').value||4
};}

// 破底翻，五步（第 1-3 步在周线上，第 4-5 步在日线上）：
//   1. 破低周 b —— 最低价跌破前 supportWeeks 周的最低价 sup（= 支撑价）。
//      记下这根的收盘 bc、最高 H、最低 L。突破线 = bc × (1+breakPct%)。
//   2. 打底  —— 之后最多 maxWait 周内不得再明显创新低（跌破 L 超过 tolPct 就作废）。
//   3. 突破  —— 哪一天的「最高价」摸到突破线，那天就是突破日。
//      周线的最高价就是那一周所有日线最高价的最大值，所以「哪一周突破」在周线上
//      算得出来，只有「哪一天」要日线——第 4、5 步反正也要日线，一起取。
//   4-5. 见 dayCheck()：守住支撑价 dayN 天，再看有没有回踩到 支撑价 ±pbPct%。
function scan(w,p,wr){
  const N=w.length,L=i=>w[i][3],C=i=>w[i][4],HI=i=>w[i][2];
  let best=null;
  for(let b=p.supportWeeks;b<N;b++){
    let sup=Infinity;
    for(let k=b-p.supportWeeks;k<b;k++) sup=Math.min(sup,L(k));
    if(!isFinite(sup)||L(b)>=sup) continue;          // must break below the prior low
    const bl=L(b), bh=HI(b), bc=C(b);
    // 突破线 = 破低周「最高价 H」再往上一段：「H+breakPct%」「H+breakTicks 跳」「支撑价」三者取最高。
    // 语义是「收复破低那根的全部跌幅，再多走一点」。用 H 而不是收盘价：H 是市场当周真打出来的顶，
    // 而破低那根通常收在低位，从收盘算 3% 往往还没回到那根的上沿，假突破就是这么放进来的。
    // 百分比管贵股，跳动数管低价股（0.15 的股 +3% 不到一个跳动），支撑价那道底仍要留着——
    // 有 1.1% 的破低周，连 H+3% 都还在支撑价下面。
    // 突破幅度：固定 % 与「振幅倍数 × 本股周振幅」取大。
    // 同一个 3%，对周振幅 2.3% 的股票是一整周多的幅度，对 10% 的股票只有五分之一周——
    // 实测高波动股的假突破率因此高一倍，加这道跟自身波动挂钩的底线专治这个；
    // 低波动股那边仍由固定 3% 说了算（实测它们改用纯比例反而更差）。
    const pct=Math.max(p.breakPct, (p.volK||0)*(wr||0));
    const lvl=snapTick(Math.max(bh*(1+pct/100), bh+p.breakTicks*TICK(bh), sup));
    // 容忍线也对齐到跳动格子——显示的数字就是真正在比的数字
    const tolLv=snapTick(bl*(1-p.tolPct/100));
    let low=bl, li=b, r=-1;
    for(let k=b+1;k<=b+p.maxWait&&k<N;k++){
      if(L(k)<tolLv) break;                          // 又明显创新低 -> 这个底作废
      if(L(k)<low){ low=L(k); li=k; }
      if(HI(k)>=lvl){ r=k; break; }                  // 这一周之内摸到了突破线
    }
    if(r<0) continue;
    const c={sup,bh,bl,bc,lvl,pct,tolLv,low,lowIdx:li,
             // 回踩区间：下沿踩在支撑价上（跌到支撑价本身是最经典的回踩，不该判成「过头」），
             // 上沿抬到「破低周最高价 H 与支撑价的中点」——浅回踩（没跌到支撑价就站住）也认。
             // 用 H 而不是突破线：H 是市场当周真打出来的价，突破线是算出来的，参数一改就漂。
             band:[snapTick(sup*(1-p.pbPct/100)), snapTick(((bh+sup)/2)*(1+p.pbPct/100))],
             rev:C(r),revIdx:r,base:r-b,ago:N-1-r,
             bIdx:b,lowDate:w[li][0],revDate:w[r][0],breakDate:w[b][0]};
    if(!best||c.revIdx>best.revIdx) best=c;
  }
  return best;
}

// 第 4、5 步，都在日线上：
//   4. 突破日 = 突破那一周里第一根「最高价 ≥ 突破线」的日K。
//      之后连续 need 个交易日，收盘都不跌回支撑价 sup 之下。
//   5. 守住之后再数 pbDays 天，看有没有一天的最低价探进 band（支撑价 ±pbPct%）。
function dayCheck(daily,lvl,sup,revDate,need,band,pbDays){
  if(!daily||!daily.length||!band) return {state:'nodata'};
  const t0=new Date(revDate+'T00:00:00').getTime();
  let bi=-1;
  for(let i=0;i<daily.length;i++){
    if(new Date(daily[i][0]+'T00:00:00').getTime()<t0) continue;
    if(daily[i][2]>=lvl){ bi=i; break; }              // 最高价触及即算突破
  }
  if(bi<0) return {state:'nobreak'};
  // bar = 突破的那一根日线本身。整块看板的落点就是它，所以连同 OHLC 一起带出去，
  // 卡片下方那条绿框和「看日线图 →」都直接读这里，不再各自去日线里重找一遍。
  const after=daily.slice(bi+1,bi+1+need), day=daily[bi][0], bar=daily[bi];
  const bad=after.findIndex(b=>b[4]<sup);
  if(bad>=0) return {state:'fail',day,bar,need,held:bad,failDay:after[bad][0],band};
  if(after.length<need) return {state:'wait',day,bar,need,held:after.length,band};
  const from=bi+1+need, end=from+pbDays, win=daily.slice(from,end);
  const hi=win.findIndex(b=>b[3]<=band[1]);
  let pull;
  if(hi>=0) pull={state: win[hi][3]<band[0]?'deep':'in', day:win[hi][0], px:win[hi][3], band};
  else if(daily.length<end) pull={state:'wait', have:win.length, want:pbDays, band};
  else pull={state:'none', band};
  const lastBar=daily[daily.length-1];
  return {state:"ok",day,bar,need,held:need,day4:after[need-1][0],pull,band,last:lastBar[4],lastDate:lastBar[0]};
}
// locate a marker bar by the WEEK it belongs to, so weekly signals can be drawn on daily/hourly bars too
function findIdx(s,dateStr,mode,kind){
  if(!dateStr) return -1;
  if(mode==='w') return s.findIndex(b=>b[0]===dateStr);
  // anchor to the Monday of that week, so a weekly label on Mon or Tue both map to the same 7-day window
  const a=new Date(dateStr+'T00:00:00'); const dow=(a.getDay()+6)%7;
  const t0=a.getTime()-dow*864e5, t1=t0+7*864e5, ix=[];
  s.forEach((b,i)=>{const t=new Date(b[0].slice(0,10)+'T00:00:00').getTime(); if(t>=t0&&t<t1) ix.push(i);});
  if(!ix.length) return -1;
  if(kind==='low'){let bi=ix[0]; for(const i of ix) if(s[i][3]<s[bi][3]) bi=i; return bi;}
  return ix[ix.length-1];
}



// 日线图上「翻」要落在 dayCheck 实算出来的那一天。让图自己在可见范围里找「第一根触及
// 突破线的日K」是不行的：突破日若早于可见窗口，它会把窗口内后来的某一根误标成翻。
// 所以只认这一个来源——画图前由 drawModal 填好，找不到就不画。
let MDAY=null, M4DAY=null, M5DAY=null, M5DEEP=false;   // 第 3/4/5 步落在日线的哪一天
let SC=null;   // scales of the last big chart, for converting mouse position <-> data
const bt=d=>new Date(d.length>10 ? d.replace(' ','T')+':00' : d+'T00:00:00').getTime();
// fractional bar index for a timestamp; extrapolates past either end so a line can run off-chart (SVG clips it)
function xAt(s,t){
  const n=s.length; if(!n) return 0;
  const t0=bt(s[0][0]), tN=bt(s[n-1][0]);
  const span=(tN-t0)/((n-1)||1) || 1;
  if(t<=t0) return (t-t0)/span;
  if(t>=tN) return (n-1)+(t-tN)/span;
  for(let i=0;i<n-1;i++){
    const a=bt(s[i][0]), b=bt(s[i+1][0]);
    if(t>=a&&t<=b) return i+(t-a)/((b-a)||1);
  }
  return n-1;
}
function chart(w,sig,W,H,big,mode,view,draws){
  mode=mode||'w';
  let s;
  if(view && view.i1>view.i0){ s=w.slice(Math.max(0,view.i0), Math.min(w.length,view.i1)); }
  else { const cap=(big?(mode==='w'?160:mode==='d'?245:399):130); s=w.slice(-Math.min(w.length,cap)); }
  const n=s.length;
  const padL=6,padR=big?56:46,padT=big?14:10,padB=big?24:18;
  const pw=W-padL-padR, ph=H-padT-padB;
  let lo=Infinity,hi=-Infinity;
  for(const b of s){lo=Math.min(lo,b[3]);hi=Math.max(hi,b[2]);}
  if(sig){
    lo=Math.min(lo,sig.sup,sig.bl,sig.band?sig.band[0]:sig.sup);
    hi=Math.max(hi,sig.bh,sig.rev,sig.lvl||0);
  }
  const pad=(hi-lo)*0.10||hi*0.02; lo-=pad;hi+=pad;
  const X=i=>padL+(i+.5)*(pw/n), Y=v=>padT+(1-(v-lo)/(hi-lo))*ph;
  const cw=Math.max(1.3,(pw/n)*0.62);

  let g='',cs='';
  const step=Math.pow(10,Math.floor(Math.log10(hi-lo)))* ((hi-lo)/Math.pow(10,Math.floor(Math.log10(hi-lo)))>5?2:1);
  for(let v=Math.ceil(lo/step)*step; v<hi; v+=step){
    const y=Y(v);
    g+=`<line x1="${padL}" y1="${y.toFixed(1)}" x2="${W-padR}" y2="${y.toFixed(1)}" stroke="var(--bd)" stroke-width=".6" opacity=".55"/>`;
    g+=`<text x="${W-padR+5}" y="${(y+3).toFixed(1)}" fill="var(--ink3)" font-size="${big?11:9.5}" font-family="var(--mono)">${v.toFixed(2)}</text>`;
  }
  // Batch the candles into one <path> per direction. Two SVG nodes per bar means ~1000
  // elements at 500 bars, which the browser re-parses and re-lays-out on every pan frame;
  // four paths draw identically (bodies never overlap, wicks sit inside them) for ~1/40th
  // the DOM. Bodies keep the 1px floor so a doji stays visible.
  const wick={up:'',dn:''}, body={up:'',dn:''};
  s.forEach((b,i)=>{
    const k=b[4]>=b[1]?'up':'dn', x=+X(i).toFixed(1);
    const yo=Y(b[1]), yc=Y(b[4]);
    wick[k]+=`M${x} ${Y(b[2]).toFixed(1)}V${Y(b[3]).toFixed(1)}`;
    body[k]+=`M${(x-cw/2).toFixed(1)} ${Math.min(yo,yc).toFixed(1)}h${cw.toFixed(1)}v${Math.max(1,Math.abs(yc-yo)).toFixed(1)}h${(-cw).toFixed(1)}z`;
  });
  for(const k of ['up','dn']){
    const col=k==='up'?'var(--up)':'var(--dn)';
    if(wick[k]) cs+=`<path d="${wick[k]}" stroke="${col}" stroke-width="${big?1.1:.8}" fill="none"/>`;
    if(body[k]) cs+=`<path d="${body[k]}" fill="${col}"/>`;
  }

  let an='';
  if(sig){
    // 四条价位线 + 回踩区间框。价位常常挨得很近（支撑价 ±1% 的带子只有一两个跳动），
    // 所以线照实画，标签另外排：先按 y 排序，再把挨太近的往下推，谁也不压谁。
    const L4=[
      {v:sig.sup,   c:'var(--sup)', t:'支撑价',   w:1.4, d:'6,3',  o:.95},
      {v:sig.lvl,   c:'var(--rev)', t:'突破线',   w:1.1, d:'2,4',  o:.85},
      {v:sig.bh,    c:'#e8b339',    t:'最高价 H', w:1,   d:'4,3',  o:.75},
      {v:sig.bl,    c:'#9b8cff',    t:'最低价 L', w:1,   d:'4,3',  o:.75}
    ].filter(o=>o.v>0);

    // 回踩区间：一个带虚线边框的框，框住 支撑价 ±pbPct%
    if(sig.band && sig.band[1]>sig.band[0]){
      const y1=Y(sig.band[1]), y2=Y(sig.band[0]);
      an+=`<rect x="${padL}" y="${y1.toFixed(1)}" width="${(W-padR-padL).toFixed(1)}" height="${Math.max(2,y2-y1).toFixed(1)}"`
        + ` fill="var(--sup)" fill-opacity=".13" stroke="var(--sup)" stroke-width=".8" stroke-dasharray="3,3" stroke-opacity=".6"/>`;
    }
    for(const o of L4){
      const y=Y(o.v);
      an+=`<line x1="${padL}" y1="${y.toFixed(1)}" x2="${W-padR}" y2="${y.toFixed(1)}" stroke="${o.c}" stroke-width="${o.w}" stroke-dasharray="${o.d}" opacity="${o.o}"/>`;
    }
    // 标签只在大图上出——卡片那么小，四个标签铺上去就把K线盖住了
    if(big){
      const items=L4.map(o=>({...o,y:Y(o.v)})).sort((a,b)=>a.y-b.y);
      const gap=18;
      for(let i=1;i<items.length;i++) if(items[i].y-items[i-1].y<gap) items[i].y=items[i-1].y+gap;
      const over=items[items.length-1].y-(H-padB-3);
      if(over>0) items.forEach(it=>it.y-=over);
      for(const it of items){
        const yTrue=Y(it.v);
        // 标签被推开之后就不在它那条线上了，拉一根细引线接回去，免得对错行
        if(Math.abs(it.y-yTrue)>2){
          an+=`<path d="M${padL+120} ${it.y.toFixed(1)}H${padL+128}V${yTrue.toFixed(1)}h6" fill="none" stroke="${it.c}" stroke-width=".7" opacity=".55"/>`;
        }
        an+=`<rect x="${padL+2}" y="${(it.y-10).toFixed(1)}" width="118" height="15" rx="3" fill="var(--card)" fill-opacity=".9" stroke="${it.c}" stroke-width=".7" stroke-opacity=".5"/>`
          + `<rect x="${padL+7}" y="${(it.y-3.2).toFixed(1)}" width="10" height="2.4" fill="${it.c}"/>`
          + `<text x="${padL+22}" y="${(it.y+1.5).toFixed(1)}" fill="${it.c}" font-size="11" font-family="var(--mono)">${it.t} ${f2(it.v)}</text>`;
      }
      if(sig.band && sig.band[1]>sig.band[0]){
        const yb=Y(sig.band[0]), txt=`回踩区间 ${f2(sig.band[0])}–${f2(sig.band[1])}`;
        an+=`<rect x="${(W-padR-4-136).toFixed(1)}" y="${(yb+2).toFixed(1)}" width="136" height="14" rx="3" fill="var(--sup)" fill-opacity=".18" stroke="var(--sup)" stroke-width=".8" stroke-opacity=".75"/>`
          + `<text x="${W-padR-9}" y="${(yb+12.5).toFixed(1)}" fill="var(--sup)" font-size="10.5" font-family="var(--mono)" text-anchor="end">${txt}</text>`;
      }
    }
    const bi=findIdx(s,sig.breakDate,mode,'low'), fs=big?12:10;
    // 「翻」的落点只认 dayCheck 算出的突破日（MDAY），周线则仍按周锚定。
    let ri;
    if(mode==='d'){
      ri = MDAY ? s.findIndex(b=>b[0].slice(0,10)===MDAY) : -1;
    }else{
      ri=findIdx(s,sig.revDate,mode,'rev');
    }
    if(bi>=0){const x=X(bi),y=Y(s[bi][3]);
      an+=`<path d="M${x} ${y+5} l-3.4 -5.4 h6.8 z" fill="var(--sup)"/>`+
          `<text x="${x}" y="${y+18}" fill="var(--sup)" font-size="${fs}" text-anchor="middle" font-weight="600">破</text>`;}
    // 「翻」锚在最高价（K线最上沿）：突破的定义本来就是「最高价摸到突破线」，
    // 锚在收盘会落在实体中间，跟那条绿色突破线对不上，也容易被实体盖住。
    if(ri>=0){const x=X(ri),y=Y(s[ri][2]);
      an+=`<path d="M${x} ${y-5} l-3.4 5.4 h6.8 z" fill="var(--rev)"/>`+
          `<text x="${x}" y="${y-10}" fill="var(--rev)" font-size="${fs}" text-anchor="middle" font-weight="600">翻</text>`;
      // 日线大图上把突破那一根整个圈起来——「看日线图 →」跳过来之后，一眼就认得是哪一根
      if(big && mode==='d'){
        const yt=Y(s[ri][2]), yb=Y(s[ri][3]);
        an+=`<rect x="${(x-cw/2-3).toFixed(1)}" y="${(yt-3).toFixed(1)}" width="${(cw+6).toFixed(1)}"`
          + ` height="${Math.max(8,yb-yt+6).toFixed(1)}" rx="2" fill="none"`
          + ` stroke="var(--rev)" stroke-width="1.3" stroke-dasharray="3,2.5"/>`;
      }}
    // ④⑤：第 4、5 步通过时标在日线上，落点同样只认 dayCheck 算出的那两天。
    // 都摆在 K 线下方——第 4 步看收盘守住支撑价、第 5 步看最低价探进区间，
    // 都是「下缘」的事；上方留给「翻」，不会挤在一起。
    if(mode==='d'){
      const pts=[];
      if(M4DAY){ const k=s.findIndex(b=>b[0].slice(0,10)===M4DAY); if(k>=0) pts.push({k,t:'④',c:'var(--rev)'}); }
      if(M5DAY){ const k=s.findIndex(b=>b[0].slice(0,10)===M5DAY); if(k>=0) pts.push({k,t:'⑤',c:M5DEEP?'#e8b339':'var(--rev)'}); }
      pts.sort((a,b)=>a.k-b.k);
      let lastX=-999, lvl=0;
      for(const pt of pts){
        const x=X(pt.k), y=Y(s[pt.k][3]);
        if(x-lastX<16) lvl++; else lvl=0;      // 挨太近就再往下放一档，免得叠字
        lastX=x;
        an+=`<text x="${x}" y="${(y+16+lvl*13).toFixed(1)}" fill="${pt.c}" font-size="${fs}" text-anchor="middle" font-weight="600">${pt.t}</text>`;
      }
    }
  }
  const last=s[s.length-1], lc=last[4], up=lc>=last[1];
  const yl2=Y(lc), bw=big?52:40;
  an+=`<rect x="${W-padR+1}" y="${(yl2-8).toFixed(1)}" width="${bw}" height="16" rx="3" fill="${up?'var(--up)':'var(--dn)'}"/>`+
      `<text x="${W-padR+1+bw/2}" y="${(yl2+4).toFixed(1)}" fill="#fff" font-size="${big?11.5:10}" text-anchor="middle" font-family="var(--mono)" font-weight="600">${lc.toFixed(2)}</text>`;

  let xl='';
  const marks=big?7:4;
  for(let k=0;k<marks;k++){
    const i=Math.round(k*(n-1)/(marks-1)), d=s[i][0].split('-');
    xl+=`<text x="${X(i).toFixed(1)}" y="${H-4}" fill="var(--ink3)" font-size="${big?10.5:9}" text-anchor="middle" font-family="var(--mono)">${d[0].slice(2)}/${d[1]}</text>`;
  }
  let dr='';
  if(big){
    SC={W,H,padL,padR,n,s,X,Y,lo,hi,ph,padT,pw};
    (draws||[]).forEach((o,k)=>{
      if(o.k==='h'){
        const y=Y(o.y); if(y<padT-2||y>padT+ph+2) return;
        dr+=`<line x1="${padL}" y1="${y.toFixed(1)}" x2="${W-padR}" y2="${y.toFixed(1)}" stroke="#e8b339" stroke-width="1.2" stroke-dasharray="6,3"/>`
          + `<text x="${padL+4}" y="${(y-4).toFixed(1)}" fill="#e8b339" font-size="10.5" font-family="var(--mono)">${o.y.toFixed(3)}</text>`;
      }else{
        // anchor by TIME, not bar index, so a line drawn on 周线 lands correctly on 日线/小时线 too
        const i1=xAt(s,bt(o.d1)), i2=xAt(s,bt(o.d2));
        dr+=`<line x1="${X(i1).toFixed(1)}" y1="${Y(o.y1).toFixed(1)}" x2="${X(i2).toFixed(1)}" y2="${Y(o.y2).toFixed(1)}" stroke="#e8b339" stroke-width="1.4"/>`;
      }
    });
  }
  return `<svg viewBox="0 0 ${W} ${H}">${g}${cs}${an}${dr}${xl}</svg>`;
}



const BUILD='0909-l-R14';   // L = 本地版（带刷新按钮）    // bump on every edit; shown top-left so a stale cache is obvious
let MTF='w';             // 'w' 周线 · 'd' 日线（日线是开图时按需抓的，不进 data.json）
let ROWS=[], BYSEC=new Map(), OPEN=new Set(), FULL=new Map(), COLLAPSED=false;

// ---- watchlist -----------------------------------------------------------
// A pinned set of tickers rendered above the sectors, so the names you actually follow
// are not buried three sections down. Kept in the artifact db (same store as the
// drawings) so it follows you across devices, with localStorage as the local record.
const WKEY='bursa_sector_watch_v1';
let WATCH=new Set(), WDOC=null;
try{ const raw=localStorage.getItem(WKEY); if(raw) WATCH=new Set(JSON.parse(raw)||[]); }catch(e){}
function saveWatch(){
  try{ localStorage.setItem(WKEY,JSON.stringify([...WATCH])); }catch(e){}
  if(WDOC) WDOC.set({list:[...WATCH]}).catch(()=>{});
  // 本地版再落一份文件：localStorage 清掉就没了，文件不会。写回时不带 union 标志，
  // 所以那个一次性合并的开关会自己关掉。
  if(LOCAL) fetch('/api/watch',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({list:[...WATCH],ts:new Date().toISOString()})}).catch(()=>{});
}
// 本地版的开机同步。云端靠 claude.use('db')（跟着帐号走），本地没有那个 API，
// 靠的是中转站上的 watch.json。
//   union:true  → 跟浏览器里现有的合并（我做一次性对齐时才会设）
//   没有这个标志 → 文件说了算，这样取消星标才不会下次开机又冒回来
async function initWatchFile(){
  if(!LOCAL) return;
  let j=null;
  try{ const r=await fetch('/api/watch?'+Date.now()); if(r.ok) j=await r.json(); }catch(e){}
  const remote=j&&Array.isArray(j.list)?j.list:null;
  if(remote){
    if(j.union) remote.forEach(t=>WATCH.add(t));
    else WATCH=new Set(remote);
  }
  saveWatch();                     // 文件不存在时顺手用浏览器里那份把它建起来
  renderWatch();
}
async function initWatchDB(){
  try{
    if(!window.claude||typeof window.claude.use!=='function') return;
    const db=await claude.use('db'); if(!db) return;
    WDOC=db.doc('watch/list');
    let first=true;
    WDOC.onSnapshot(snap=>{
      const remote=((snap.exists&&snap.data())||{}).list;
      if(!Array.isArray(remote)){ if(first&&WATCH.size) saveWatch(); first=false; return; }
      if(first){
        first=false;
        // union on the first sync so names added before db connected are not lost
        const before=WATCH.size; remote.forEach(t=>WATCH.add(t));
        if(WATCH.size!==before||remote.length!==WATCH.size) saveWatch();
      }else{
        WATCH=new Set(remote);
        try{ localStorage.setItem(WKEY,JSON.stringify([...WATCH])); }catch(e){}
      }
      renderWatch();
    },()=>{ WDOC=null; });
  }catch(e){ WDOC=null; }
}
initWatchDB();


function render(){
  const p=P();

    const idx=BYSEC.get(s);

    +`「刚发生」窗口 ${p.recentWeeks} 周 → ${p.recentWeeks} 周内 ${totalHot} 只 · 十年内曾出现 ${withSig}/${ROWS.length} 只`;

    +`本地版全部抓 10 年周线（上市不足 10 年的，有多少给多少）。`
    +`板块列表和破底翻判定都跑在周线上（这是个周线形态）；点开任何一只股，图上方可以切「日线」——日线是那一刻现抓的，不占页面体积。<br>`
    +`板块与股票代码取自 Bursa 官方分类（KLSE Screener），Yahoo 符号 = 股票代码 + .KL，不存在匹配错公司的可能。已剔除上市不足 60 周的新股，以及 ETF／债券／商业信托／封闭式基金。`;

  // headers render now, cards only when a section is open — building 322 charts up front is waste
  $('secs').innerHTML=secs.map(x=>{
    const open = COLLAPSED ? OPEN.has(x.s) : (OPEN.has(x.s) || x.hot>0);
    if(open) OPEN.add(x.s);
    return `<div class="sec${open?' open':''}" data-sec="${esc(x.s)}">
      <div class="sechd"><span class="chev">▶</span>
        <span class="nm">${esc(x.s)}</span>
        ${x.hot?`<span class="hot">${x.hot} 只刚发生</span>`:''}
        <span class="cnt" style="margin-left:auto">共 ${x.n} 只</span></div>
      <div class="secbody"></div></div>`;
  }).join('');
  secs.forEach(x=>{ if(OPEN.has(x.s)) fillSection(x.s); });
  renderWatch();
  renderFound();
  renderDayRes();
}


// ---- 日图结果面板 --------------------------------------------------------
// 汇总那行数字点不动，要在 13 个板块里翻卡片才知道是哪几只。这里按状态分组：
// 前三组（要看图判断的）铺卡片，后几组（已经淘汰的）只列代码——省掉几十张
// SVG 的渲染，扫一眼名字也够了。
const DGROUPS=[
  {k:'in',    t:'✓ 回踩到位', cards:true },
  {k:'deep',  t:'◑ 回踩偏深', cards:true },
  {k:'pwait', t:'⏳ 还在等',  cards:true },
  {k:'none',  t:'○ 没回踩',   cards:false},
  {k:'wait',  t:'⋯ 观察中',   cards:false},
  {k:'fail',  t:'✗ 跌回',     cards:false},
  {k:'other', t:'? 无法判定', cards:false}
];
let DOPEN=new Set(['in']);
function groupOf(r){
  if(!r) return null;
  if(r.state==='ok'){
    const p=r.pull;
    if(!p) return 'none';
    if(p.state==='in'||p.state==='deep'){
      return p.state;
    }
    return p.state==='wait'?'pwait':'none';
  }
  return r.state==='wait'?'wait':r.state==='fail'?'fail':'other';
}
function renderDayRes(){
  const box=$('dayres'); if(!box) return;
  if(CLOUD){ box.innerHTML=''; return; }   // 云端没有「✓ 日图确认」这个按钮，提示它就是误导
  if(!DAYOK.size){
    // 没跑过就给一行提示，而不是一片空白——不然会以为功能没生效
    box.innerHTML=`<p class="drhd">日图结果：还没核对。点右上角蓝色的「✓ 日图确认」`
      +`，约 30 秒跑完 4 周内的全部突破，这里会按「回踩到位 / 偏深 / 还在等 / 没回踩 / 观察中 / 跌回」分组列出来。</p>`;
    return;
  }
  const p=P(), byG=new Map();
  ROWS.forEach((d,i)=>{
    const g=groupOf(DAYOK.get(d.t));
    if(!g) return;
    if(!byG.has(g)) byG.set(g,[]);
    byG.get(g).push(i);
  });
  const secs=DGROUPS.filter(g=>byG.has(g.k)).map(g=>{
    const idx=byG.get(g.k), open=DOPEN.has(g.k);
    const body=!open?''
      : g.cards ? `<div class="grid">${idx.map(i=>card(i,p,true)).join('')}</div>`
      : `<div class="tks">${idx.map(i=>`<button class="tk" data-i="${i}" title="${esc(ROWS[i].n)}">${esc(ROWS[i].t)}</button>`).join('')}</div>`;
    return `<div class="sec${open?' open':''}" data-dg="${g.k}">
      <div class="sechd"><span class="chev">▶</span>
        <span class="nm">${g.t}</span>
        <span class="cnt">${idx.length} 只</span>
        <button class="cp" data-cp="${g.k}">复制代码</button></div>
      <div class="secbody">${body}</div></div>`;
  }).join('');
  const chips=DGROUPS.filter(g=>byG.has(g.k)).map(g=>
    `<button class="dchip g-${g.k}${DOPEN.has(g.k)?' on':''}" data-jump="${g.k}">${g.t}<b>${byG.get(g.k).length}</b></button>`).join('');
  box.innerHTML=`<p class="drhd">日图结果 · 已核对 ${DAYOK.size} 只 · 参数一改就作废，要重跑「✓ 日图确认」</p>`
    +`<div class="dchips">${chips}</div>`+secs;
}
$('dayres').addEventListener('click',e=>{
  const cp=e.target.closest('.cp');
  if(cp){
    e.stopPropagation();
    const list=ROWS.filter(d=>groupOf(DAYOK.get(d.t))===cp.dataset.cp).map(d=>d.t).join(',');
    const done=()=>{ const o=cp.textContent; cp.textContent='已复制 '+list.split(',').length+' 个'; setTimeout(()=>cp.textContent=o,1600); };
    if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(list).then(done,()=>fallbackCopy(list,done));
    else fallbackCopy(list,done);
    return;
  }
  const jp=e.target.closest('.dchip');

  const tk=e.target.closest('.tk');

  const c=e.target.closest('.card');
  if(c){ cardClick(e,+c.dataset.i); return; }
  const hd=e.target.closest('.sechd');
  if(!hd) return;
  const k=hd.parentElement.dataset.dg;
  if(DOPEN.has(k)) DOPEN.delete(k); else DOPEN.add(k);

});
function fallbackCopy(text,done){
  try{
    const ta=document.createElement('textarea');
    ta.value=text; ta.style.cssText='position:fixed;left:-9999px';
    document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); ta.remove(); done();
  }catch(err){ alert(text); }
}

// （以前是搜中即加入清单，等于替人做主，还容易误加。）

function renderFound(){
  const box=$('findsec'); if(!box) return;

function renderWatch(){
  const box=$('watchsec'); if(!box||!ROWS.length) return;
  const p=P();
  const idx=ROWS.map((d,i)=>i).filter(i=>WATCH.has(ROWS[i].t))
                .sort((a,b)=>(ROWS[a].sig?ROWS[a].sig.ago:9e9)-(ROWS[b].sig?ROWS[b].sig.ago:9e9));
  if(!idx.length){
    box.innerHTML=`<div class="sec open"><div class="sechd" style="cursor:default">
      <span class="nm">⭐ 观察清单</span>

      <span class="cnt" style="margin-left:auto">共 ${idx.length} 只</span></div>
    <div class="secbody"><div class="grid">${idx.map(i=>card(i,p,true)).join('')}</div></div></div>`;
  box.querySelectorAll('.card').forEach(c=>c.addEventListener('click',ev=>cardClick(ev,+c.dataset.i)));
}
function toggleWatch(t){
  if(WATCH.has(t)) WATCH.delete(t); else WATCH.add(t);
  saveWatch();
  renderWatch();
  document.querySelectorAll('.card').forEach(c=>{
    const st=c.querySelector('.star'); if(!st) return;
    st.classList.toggle('on', WATCH.has(ROWS[+c.dataset.i].t));
    st.textContent = WATCH.has(ROWS[+c.dataset.i].t) ? '★' : '☆';
  });
}

function fillSection(s){
  const el=document.querySelector(`.sec[data-sec="${CSS.escape(s)}"] .secbody`);
  if(!el) return;
  const p=P(), idx=BYSEC.get(s)||[];
  const inWin=i=>ROWS[i].sig && ROWS[i].sig.ago<=p.recentWeeks;
  const byAgo=(a,b)=>(ROWS[a].sig?ROWS[a].sig.ago:9e9)-(ROWS[b].sig?ROWS[b].sig.ago:9e9);
  const hot=idx.filter(inWin).sort(byAgo);
  const rest=idx.filter(i=>!inWin(i)).sort(byAgo);
  const ordered=hot.concat(rest);
  // 板块里有「刚发生」的就先只铺这些；一只都没有就先铺一页。
  // 每张卡片都是一张 SVG K线图，一个板块一百多只一次画完会顿，所以分页加载。
  const want=FULL.has(s)?FULL.get(s):(hot.length||Math.min(PAGE,ordered.length));
  const n=Math.min(want,ordered.length);
  if(+el.dataset.done===n) return;
  const left=ordered.length-n;
  el.innerHTML=`<div class="grid">${ordered.slice(0,n).map(i=>card(i,p)).join('')}</div>`
    +(left?`<button class="more" data-full="${esc(s)}">再显示 ${Math.min(PAGE,left)} 只（该板块还有 ${left} 只）</button>`:'');
  el.dataset.done=String(n);
  el.querySelectorAll('.card').forEach(c=>c.addEventListener('click',ev=>cardClick(ev,+c.dataset.i)));
}

// ---- 突破的那根日线：卡片和大图下方共用的那条绿框 ----------------------------
// 周线只告诉你「哪一周」摸到了突破线；真正下单看的是「哪一天」。这条框就是把那
// 一天摊开：日期 + 当天 OHLC + 最高价越过突破线多少，再配一个按钮直接跳过去。
// 数据一律读 DAYOK（dayCheck 的结果），图和字因此永远来自同一次计算。
// showEmpty：还没核对过的那些要不要也占一行。大图里永远要，卡片上只给「刚发生」
// 的那几只——666 张卡全挂一条「还没核对」，纯粹是噪音。
function dbarRow(i,inModal,showEmpty){
  if(CLOUD) return '';                 // 云端没有日线，这条框和它的按钮都没有意义
  const d=ROWS[i], s=d.sig; if(!s) return '';
  const rr=DAYOK.get(d.t), b=rr&&rr.bar;
  if(!b && !inModal && !showEmpty) return '';
  const btn=`<button class="dbtn"${inModal?' data-godl="1"':` data-gd="${i}"`}>${
    inModal&&MTF==='d' ? '定位到那一根 →' : '看日线图 →'}</button>`;
  if(!b){
    const why = !rr                    ? '还没核对 —— 点右边直接切到日线，自动找出是哪一天'
      : rr.state==='nobreak'           ? `${s.revDate} 那周之后，日线里还找不到最高价摸到突破线 ${f2(s.lvl)} 的那一天`
      : '这只股没有日线数据';
    return `<div class="dbar"><span class="lab">突破的那根日线</span>
      <span style="color:var(--ink3)">${why}</span>${btn}</div>`;
  }
  const up=b[4]>=b[1], over=b[2]-s.lvl, tk=TICK(s.lvl);
  return `<div class="dbar hit">
    <span class="lab">突破的那根日线</span>
    <span class="tm">${esc(String(b[0]).slice(0,10))}</span>
    <span><b>开</b>${f2(b[1])}</span>
    <span><b>高</b><i style="font-style:normal;color:var(--rev)">${f2(b[2])}</i></span>
    <span><b>低</b>${f2(b[3])}</span>
    <span><b>收</b><i style="font-style:normal;color:${up?'var(--up)':'var(--dn)'}">${f2(b[4])}</i></span>
    <span style="color:var(--ink3)">${over<tk/2
      ? `最高价正好摸到突破线 ${f2(s.lvl)}`
      : `最高价越过突破线 ${f2(s.lvl)} 达 ${f2(over)}（${
          Math.round(over/tk*10)/10} 个跳动 · +${(over/s.lvl*100).toFixed(2)}%）`}</span>
    ${btn}</div>`;
}
// 打开大图并直接落在突破那一天：先确保有日线，切到日线，再把那根摆到正中。

// always：这张卡是被单独挑出来看的（搜寻结果、观察清单、日图结果面板），那条绿框
// 就算还没核对也留着，反正统共没几张。板块清单是 666 张，只给「刚发生」的那些。
function card(i,p,always){
  const d=ROWS[i], s=d.sig;
  const wrCls=d.wr>=7?' hi':'';
  const badge=!s ? `<span class="ago" style="color:var(--ink3)">十年内无</span>`
    : s.ago<=p.recentWeeks ? `<span class="ago hot">${s.ago===0?'本周':s.ago+' 周前'}</span>`
    : `<span class="ago">${s.ago} 周前</span>`;
  const dc=s?DAYOK.get(d.t):null;
  const dcb=!dc?'':
      dc.state==='ok'   ? `<span class="dc ok">日线 ${dc.held}/${dc.need} ✓</span>`
    : dc.state==='wait' ? `<span class="dc wait">日线 ${dc.held}/${dc.need} 观察中</span>`
    : dc.state==='fail' ? `<span class="dc bad">日线 ✗ ${dc.failDay.slice(5)} 跌回</span>`
    : dc.state==='nobreak' ? `<span class="dc bad">日线未见突破日</span>`
    : `<span class="dc bad">无日线</span>`;
  // 第 5 步只有在第 4 步守住之后才有意义
  const pu=dc&&dc.state==='ok'?dc.pull:null;
  const pub=!pu?'':
      pu.state==='in'   ? `<span class="dc ok">回踩 ${pu.day.slice(5)}</span>`
    : pu.state==='deep' ? `<span class="dc wait">回踩偏深 ${pu.day.slice(5)}</span>`
    : pu.state==='wait' ? `<span class="dc wait">回踩 ${pu.have}/${pu.want} 日</span>`
    : `<span class="dc">未回踩</span>`;
  return `<div class="card${s&&s.ago<=p.recentWeeks?' hot':''}" data-i="${i}">
    <div class="ch">
      <div><div class="nm">${esc(d.n)}</div><div class="sy">${d.sym} · ${esc(d.i||d.s)}</div></div>
      <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end">
        <button class="star${WATCH.has(d.t)?' on':''}" title="加入/移出观察清单">${WATCH.has(d.t)?'★':'☆'}</button>
        <span class="wr${wrCls}" title="近52周典型周振幅">振幅 ${d.wr}%</span>${dcb}${pub}${badge}</div>
    </div>
    <div class="cv">${chart(d.w,s,430,168,false,'w')}</div>
    ${s?`<div class="st">
      <span><b>支撑</b><i class="r" style="font-style:normal">${f2(s.sup)}</i></span>
      <span><b>破低</b>${f2(s.bl)}</span>
      <span><b>突破线</b><i class="g" style="font-style:normal">${f2(s.lvl)}</i></span>
      <span><b>破低周收盘</b>${f2(s.bc)}</span>
      <span><b>等待</b>${s.base} 周</span>
    </div>`:`<div class="st"><span style="color:var(--ink3)">当前参数下没有符合的破底翻结构</span></div>`}
    ${dbarRow(i,false,!!(always||(s&&s.ago<=p.recentWeeks)))}
  </div>`;
}

const DRAWS={};                                   // key `${ticker}|${tf}` -> array of shapes (kept in price/date space)
// drawings persist per viewer in this browser; storage can be unavailable (private window, blocked site data), so every access is guarded
const LSKEY='bursa_sector_draws_v1';
function loadDraws(){
  try{
    const raw=localStorage.getItem(LSKEY); if(!raw) return;
    const o=JSON.parse(raw); if(!o||typeof o!=='object') return;
    for(const k in o){                       // migrate old per-timeframe keys (`TICKER|w`) into one shared `TICKER`
      const t=k.split('|')[0];
      DRAWS[t]=(DRAWS[t]||[]).concat(o[k]||[]);
    }
  }catch(e){}
}
function cleanDraws(){ const k={}; for(const t in DRAWS) if(DRAWS[t]&&DRAWS[t].length) k[t]=DRAWS[t]; return k; }
function saveLocal(){ try{ localStorage.setItem(LSKEY,JSON.stringify(cleanDraws())); }catch(e){} }
function saveDraws(){
  saveLocal();
  if(DBDOC){ DBDOC.set(cleanDraws()).catch(()=>{}); }   // fire-and-forget; local copy already holds it
}
function countDraws(){ let n=0; for(const k in DRAWS) n+=(DRAWS[k]||[]).length; return n; }
loadDraws();

// ---- cross-device sync ---------------------------------------------------
// On the published artifact, drawings live in the artifact's own store so every
// device you sign in from sees the same lines. Opened as a local file there is no
// window.claude, so this quietly does nothing and localStorage remains the record.
let DBDOC=null, DBSYNCED=false;
async function initDB(){
  try{
    if(!window.claude||typeof window.claude.use!=='function') return;
    const db=await claude.use('db');
    if(!db) return;
    DBDOC=db.doc('sector_draws/all');
    let first=true;
    DBDOC.onSnapshot(snap=>{
      const remote=(snap.exists&&snap.data())||{};
      if(first){
        first=false;
        // union on the first sync so lines drawn on this device before it connected aren't lost
        let differs=false;
        for(const t in remote) if(Array.isArray(remote[t])){
          if(JSON.stringify(DRAWS[t]||[])!==JSON.stringify(remote[t])) differs=true;
          DRAWS[t]=remote[t];
        }
        for(const t in DRAWS) if(!(t in remote)) differs=true;
        if(differs) DBDOC.set(cleanDraws()).catch(()=>{});
      }else{
        for(const t in DRAWS) delete DRAWS[t];
        for(const t in remote) if(Array.isArray(remote[t])) DRAWS[t]=remote[t];
      }
      DBSYNCED=true; saveLocal();
      if($('modal')&&$('modal').classList.contains('on')) drawModal();
    },()=>{ DBDOC=null; });
  }catch(e){ DBDOC=null; }
}
initDB();


// 结构说明默认收起——看熟了每次都跳过那六行是负担。选择记在本机，
// 不然「默认收起」会变成「每只股都要点一次」，比不做还烦。

try{ NOTEOPEN = localStorage.getItem(NKEY)==='1'; }catch(e){}
let MI=-1, MRANGE='260', MTOOL=null, PEND=null;
const RANGES_W=[{k:'260',t:'5年',n:260},{k:'all',t:'10年'}];
const RANGES_D=[{k:'65',t:'3个月',n:65},{k:'130',t:'半年',n:130},{k:'250',t:'1年',n:250},
                {k:'750',t:'3年',n:750},{k:'all',t:'10年'}];
const RANGES=()=>MTF==='d'?RANGES_D:RANGES_W;
// 日线只留在这次会话的内存里：666 只 × 2400 根 ≈ 60MB，全存进 data.json 页面会被拖垮，
// 而单只从本地中转站抓一次只要 0.3 秒左右，用哪只抓哪只更划算。
const DAILY=new Map();   // ticker -> 日线K线（10年，图表用）
const DCACHE=new Map();  // ticker -> 日线K线（3年，只给批量日图确认用）
const DAYOK=new Map();   // ticker -> dayCheck() 的结果
const dkey=()=>ROWS[MI].t;
function barsFor(d){ return MTF==='d' ? (DAILY.get(d.t)||[]) : d.w; }
function limitBars(){ const o=RANGES().find(x=>x.k===MRANGE); return (!o||o.k==='all')?99999:Math.max(12,o.n); }

let VIEW=null;
const MINBARS=15;
function curBars(){ return (MI>=0 && barsFor(ROWS[MI],MTF)) || []; }
function resetView(){
  const b=curBars(), lim=limitBars();
  const n=Math.min(b.length, lim===99999?b.length:lim);
  VIEW={i0:Math.max(0,b.length-n), i1:b.length};
}
function clampView(){
  const b=curBars(); if(!VIEW) return;
  let {i0,i1}=VIEW;
  let n=Math.max(MINBARS, Math.min(b.length, Math.round(i1-i0)));
  i0=Math.round(i0); i1=i0+n;
  if(i1>b.length){ i1=b.length; i0=Math.max(0,i1-n); }
  if(i0<0){ i0=0; i1=Math.min(b.length,n); }
  VIEW={i0,i1};
}
function zoomAt(fx,factor,fast){          // fx = 0..1 horizontal position inside the plot
  const b=curBars(); if(!VIEW||!b.length) return;
  const n=VIEW.i1-VIEW.i0;
  const anchor=VIEW.i0+fx*n;                       // bar index under the cursor, kept in place
  let nn=Math.round(n*factor);
  nn=Math.max(MINBARS, Math.min(b.length, nn));
  VIEW={i0:anchor-fx*nn, i1:anchor-fx*nn+nn};
  if(fast){ nudge(); return; }
  clampView(); drawModal();
}
function panBars(dBars){
  if(!VIEW) return;
  VIEW={i0:VIEW.i0+dBars, i1:VIEW.i1+dBars};
  clampView(); drawModal();
}
// 把某一天摆到视野正中，并留出 width 根的宽度——「看日线图 →」就是靠它跳过去的。
// 先按日期精确找，找不到（比如那天停牌、不在这个周期里）才退回按时间插值定位。
function centerOn(dateStr,width){
  const b=curBars(); if(!b.length||!dateStr) return;
  let idx=b.findIndex(x=>String(x[0]).slice(0,10)===String(dateStr).slice(0,10));
  if(idx<0) idx=Math.round(xAt(b,bt(dateStr)));
  const n=Math.max(MINBARS,Math.min(b.length,width));
  const i0=idx-Math.round(n*0.5);
  VIEW={i0, i1:i0+n};
  clampView();
}


// ---- gestures ------------------------------------------------------------
// Pointer Events, not touch events. A touchscreen is a first-class pointer on every
// current browser, and one code path then covers finger, pen and mouse alike. The
// reason it matters: if the browser declines to synthesise touch events for a device,
// the page falls back to *compatibility* mouse events, which are only dispatched once
// the touch sequence has ended — the finger moves, nothing happens, then it jumps.
// pointerdown/move fire immediately regardless of input type, and setPointerCapture
// keeps the stream coming even though drawModal() replaces the <svg> mid-gesture.
// Registered ONCE at module scope: these used to sit inside open_(), so every card
// opened stacked another permanent copy.
const PTR=new Map();                 // live pointers: id -> {x,y}
let GEST=null, RAF=0;
// ?dbg=1 prints what actually fired, so a "feels slow" report can be measured
// instead of guessed at: input type, ms from press to first movement, ms per move.
let DBG=/[?&]dbg=1/.test(location.search);   // or press D — the query string does not
                                            // survive into the artifact's iframe
let dT=0,dN=0,dFirst=0,dKind='';
function chartRect(){
  const box=$('mchart'), svg=box&&box.querySelector('svg');
  const r=svg&&svg.getBoundingClientRect();
  return r&&r.width ? r : null;
}
const fxAt=(x,r)=>Math.max(0,Math.min(1,((x-r.left)/r.width*SC.W-SC.padL)/SC.pw));
const twoPtr=()=>{ const a=[...PTR.values()]; return a.length>=2?[a[0],a[1]]:null; };
const pDist=p=>Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);
const pMid =p=>(p[0].x+p[1].x)/2;
// One redraw per frame while dragging, and drawModal(true) skips the toolbar rebuild.
// The first move of a gesture draws synchronously — a frame of wait there reads as lag.
function nudge(now){
  if(now){
    if(RAF){ cancelAnimationFrame(RAF); RAF=0; }
    clampView(); drawModal(true); return;
  }
  if(RAF) return;
  RAF=requestAnimationFrame(()=>{ RAF=0; clampView(); drawModal(true); });
}
function startGesture(){
  GEST=null;
  const r=chartRect(); if(!r||!SC||!VIEW||!PTR.size) return;
  const n=VIEW.i1-VIEW.i0, two=twoPtr();
  if(two){
    const fx=fxAt(pMid(two),r);
    GEST={mode:'pinch', r:r, d0:pDist(two), n0:n, anchor:VIEW.i0+fx*n, moved:0};
  }else if(!MTOOL){                    // drawing mode owns single-pointer taps
    const p=[...PTR.values()][0], box=$('mchart').closest('.mbox');
    GEST={mode:'pan', x:p.x, y:p.y, i0:VIEW.i0, i1:VIEW.i1,
          perPx:n/(r.width*(SC.pw/SC.W)), box:box, top:box?box.scrollTop:0, axis:null, moved:0};
  }
}
function endGesture(){
  if(!GEST&&!PTR.size) return;
  GEST=null; PTR.clear();
  const m=$('mchart'); if(m) m.style.cursor='';
  drawModal();                                   // one full redraw to catch the chrome up
  if(DBG&&dN) $('mhint').innerHTML+=` <b style="color:#e8b339">[dbg ${dKind} · 首动 ${dFirst}ms ·`
    +` ${dN} 次移动 · ${Math.round((performance.now()-dT)/dN)}ms/次]</b>`;
  dN=0;
}
window.addEventListener('pointermove',e=>{
  if(!PTR.has(e.pointerId)) return;
  PTR.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(!GEST||!SC||!VIEW) return;
  if(DBG){ dN++; if(dN===1) dFirst=Math.round(performance.now()-dT); }
  if(GEST.mode==='pinch'){
    const two=twoPtr(); if(!two) return;
    const d=pDist(two); if(!d||!GEST.d0) return;
    const fx=fxAt(pMid(two),GEST.r);
    let nn=Math.round(GEST.n0*GEST.d0/d);        // fingers apart -> fewer bars -> zoom in
    nn=Math.max(MINBARS,Math.min(curBars().length,nn));
    VIEW={i0:GEST.anchor-fx*nn, i1:GEST.anchor-fx*nn+nn};
    nudge(!GEST.moved); GEST.moved=1;
    return;
  }
  const p=PTR.get(e.pointerId), dx=p.x-GEST.x, dy=p.y-GEST.y;
  if(!GEST.axis){                                // first real movement decides the axis
    if(Math.abs(dx)<2 && Math.abs(dy)<2) return;      // a tap stays a tap
    GEST.axis = Math.abs(dy)>Math.abs(dx)*1.2 ? 'y' : 'x';
  }
  if(GEST.axis==='y'){                           // touch-action:none, so scroll it ourselves
    if(GEST.box) GEST.box.scrollTop=GEST.top-dy; // 1:1 drag, no fling: the cost of owning the touch
    return;
  }
  VIEW={i0:GEST.i0-dx*GEST.perPx, i1:GEST.i1-dx*GEST.perPx};
  nudge(!GEST.moved); GEST.moved=1;
});
function liftPointer(e){
  if(!PTR.delete(e.pointerId)) return;
  if(PTR.size) startGesture();                   // 2 fingers -> 1: carry on panning
  else endGesture();
}
window.addEventListener('pointerup',liftPointer);
window.addEventListener('pointercancel',liftPointer);



function drawModal(fast){

  if(s && MTF==='d'){
    const db=DAILY.get(d.t)||DCACHE.get(d.t);
    if(db){
      const pp=P();
      const rr=dayCheck(db,s.lvl,s.sup,s.revDate,pp.dayN,s.band,pp.pbDays);
      if(rr && rr.day) MDAY=rr.day;
      // ④⑤ 只在真的通过时才标：第 4 步没过就没有 ④，回踩「观察中／没通过」就没有 ⑤
      if(rr && rr.state==='ok'){
        M4DAY=rr.day4||null;
        if(rr.pull && (rr.pull.state==='in'||rr.pull.state==='deep')){

  // 只留下面这行没有别处交代的：看的是哪个周期、显示了多少根、以及怎么操作。
  // （元素本身要保留：抓日线失败时的提示还挂在它上面。）
  $('mhint').innerHTML = `${tf} · 显示 ${shown}/${bars.length} 根K线 · ${nav}`;
  if(fast) return;                                 // a pan/zoom changes none of the chrome below
  // 第 4、5 步的结论：有日线就当场核对，没有就提示去切日线
  const md=$('mday');
  if(md && s){
    const pp=P(), dbars=DAILY.get(d.t)||DCACHE.get(d.t);
    if(!dbars){
      md.innerHTML=(CLOUD
          ? `日图确认（本页做不了，请回本地版）：`
          : `日图确认：点上方「日线」即可自动核对——`)
        +`哪一天的最高价摸到突破线：${f2(s.lvl)}，`
        +`之后 ${pp.dayN} 个交易日收盘是否都守在支撑价：${f2(s.sup)} 之上，再看 ${pp.pbDays} 日内有没有回踩进区间 ${f2(s.band[0])} – ${f2(s.band[1])}。`;
    }else{
      const rr=dayCheck(dbars,s.lvl,s.sup,s.revDate,pp.dayN,s.band,pp.pbDays);
      DAYOK.set(d.t,rr);
      const bandTxt=rr.band?`${f2(rr.band[0])}–${f2(rr.band[1])}`:'';
      const pu=rr.pull;
      // 第 5 步也要明说结论——只描述「一路没回头」，读的人不知道算不算过。
      // 用词跟第 4 步对齐：通过 / 观察中 / 没通过，外加「偏深」这个中间态。
      // 第 4 步没过时 pull 根本没算（回踩窗口是从守满之后才起算的），
      // 那就说明白为什么没有第 5 步，而不是留白让人猜。
      const puTxt = pu
        ? ( pu.state==='in'   ? ` <b style="color:var(--rev)">第 5 步通过</b> — ${pu.day} 最低：${f2(pu.px)}，回踩进区间 ${bandTxt}。`
          : pu.state==='deep' ? ` <b style="color:#e8b339">第 5 步：回踩偏深</b> — ${pu.day} 最低：${f2(pu.px)}，探到区间下沿 ${f2(rr.band[0])} 之下（算回踩，但踩过头了）。`
          : pu.state==='wait' ? ` <b style="color:#e8b339">第 5 步观察中</b> — 守住之后才过了 ${pu.have}/${pu.want} 个交易日，还没等到回踩。`

        : rr.state==='fail'    ? ` <span style="color:var(--ink3)">第 5 步：不用看了 — 第 4 步就没守住，这个形态已经作废。</span>`
        : rr.state==='wait'    ? ` <span style="color:var(--ink3)">第 5 步：还没轮到 — 回踩窗口要等第 4 步的 ${rr.need} 个交易日走完才起算。</span>`
        : rr.state==='nobreak' ? ` <span style="color:var(--ink3)">第 4、5 步都还谈不上 — 突破日还没出现。</span>`
        : '';
      md.innerHTML = (

        : rr.state==='nobreak' ? `${s.revDate} 那周之后，日线里找不到最高价摸到突破线：${f2(s.lvl)} 的那一天。`
        : `没有日线数据。`) + puTxt;
    }
  }
  // 那条绿框要排在 #mday 之后填：DAYOK 是在上面那段里才写进去的
  const mdb=$('mdbar'); if(mdb) mdb.innerHTML=dbarRow(MI,true);
  document.querySelectorAll('#mtf button[data-tf]').forEach(b=>b.classList.toggle('on',MTF===b.dataset.tf));
  const rg=$('mrg');
  if(rg){
    // An option that already reaches past the data shows everything, so keep the FIRST such
    // one usable and grey only the ones beyond it. Without this an extra-tier stock (260
    // bars) greys out 5年 — the very option it is sitting on.
    let coveredAt=-1;
    RANGES().forEach((o,idx)=>{ if(coveredAt<0 && (o.k==='all'||o.n>=bars.length)) coveredAt=idx; });
    rg.innerHTML=RANGES().map((o,idx)=>{
      const dead = coveredAt>=0 && idx>coveredAt;
      return `<button data-rg="${o.k}"${dead?' disabled title="本股只有 '+bars.length+' 根'+tf+'（约 '+Math.round(bars.length/per)+' 年），此范围与更短的选项显示相同"':''}
        style="${dead?'opacity:.4;cursor:not-allowed':''}">${o.t}</button>`;
    }).join('');
    rg.querySelectorAll('button').forEach(b=>b.classList.toggle('on',MRANGE===b.dataset.rg));
  }

    dsv.textContent = here ? `已保存 ${here} 条 · ${where}` : `画的线会保存 · ${where}`;
  }
}

function pick(ev){
  const svg=$('mchart').querySelector('svg'); if(!svg||!SC||!SC.n) return null;
  const r=svg.getBoundingClientRect();
  if(!r.width||!r.height) return null;               // container collapsed / not laid out yet
  const vx=(ev.clientX-r.left)/r.width*SC.W, vy=(ev.clientY-r.top)/r.height*SC.H;
  const price=SC.lo+(1-(vy-SC.padT)/SC.ph)*(SC.hi-SC.lo);
  const pw=SC.W-SC.padL-SC.padR;
  let i=Math.round((vx-SC.padL)/(pw/SC.n)-0.5);
  if(!isFinite(i)||!isFinite(price)) return null;
  i=Math.max(0,Math.min(SC.n-1,i));
  const bar=SC.s[i]; if(!bar) return null;
  // Snap to this bar's open/high/low/close when the cursor is within a few pixels of one.
  // A support line drawn on a prior low should land ON the low, not near it.
  const tol=(SC.hi-SC.lo)*(7/SC.ph);
  let snap=price, snapTo=null;
  for(const kv of [['开',bar[1]],['高',bar[2]],['低',bar[3]],['收',bar[4]]]){
    if(Math.abs(price-kv[1])<=tol && (snapTo===null || Math.abs(price-kv[1])<Math.abs(price-snap))){
      snap=kv[1]; snapTo=kv[0];
    }
  }
  return {price, snap, snapTo, idx:i, date:bar[0]};
}
// ---- crosshair -----------------------------------------------------------
// Drawn into an overlay <svg> on top of the chart, never into the chart string: the chart
// is a rebuilt string, and re-rendering 500 bars per pointer move undoes the batching work.
function xhLayer(){
  const box=$('mchart'); if(!box||!SC) return null;
  let l=box.querySelector('.xh');
  if(!l){
    box.insertAdjacentHTML('beforeend',
      '<svg class="xh" viewBox="0 0 '+SC.W+' '+SC.H+'">'
      +'<line class="xv" stroke="var(--ink2)" stroke-width=".7" stroke-dasharray="3,3" opacity=".85"/>'
      +'<line class="xz" stroke="var(--ink2)" stroke-width=".7" stroke-dasharray="3,3" opacity=".85"/>'
      +'<rect class="xpb" width="52" height="16" rx="3"/>'
      +'<text class="xpt" font-size="11" text-anchor="middle" font-family="var(--mono)" font-weight="600"></text>'
      +'</svg><div class="xhbox"></div>');
    l=box.querySelector('.xh');
  }
  return l;
}
function hideXH(){
  const box=$('mchart'); if(!box) return;
  const l=box.querySelector('.xh'), t=box.querySelector('.xhbox');
  if(l) l.style.display='none';
  if(t) t.style.display='none';
}
function showXH(ev){
  const box=$('mchart'); if(!box||!SC) return;
  const svg=box.querySelector('svg'); if(!svg) return;
  const r=svg.getBoundingClientRect(); if(!r.width||!r.height) return;
  const p=pick(ev); if(!p) return;
  const l=xhLayer(); if(!l) return;
  const vx=(ev.clientX-r.left)/r.width*SC.W, vy=(ev.clientY-r.top)/r.height*SC.H;
  const x=Math.max(SC.padL,Math.min(SC.W-SC.padR,vx));
  const yc=Math.max(SC.padT,Math.min(SC.padT+SC.ph,vy));
  const shown=p.snapTo ? p.snap : SC.lo+(1-(yc-SC.padT)/SC.ph)*(SC.hi-SC.lo);
  const y=SC.padT+(1-(shown-SC.lo)/(SC.hi-SC.lo))*SC.ph;
  const q=function(sel,a,v){ l.querySelector(sel).setAttribute(a,v); };
  q('.xv','x1',x); q('.xv','x2',x); q('.xv','y1',SC.padT); q('.xv','y2',SC.padT+SC.ph);
  q('.xz','y1',y.toFixed(1)); q('.xz','y2',y.toFixed(1)); q('.xz','x1',SC.padL); q('.xz','x2',SC.W-SC.padR);
  q('.xpb','x',SC.W-SC.padR+1); q('.xpb','y',(y-8).toFixed(1)); q('.xpb','fill',p.snapTo?'#e8b339':'var(--ink2)');
  q('.xpt','x',SC.W-SC.padR+27); q('.xpt','y',(y+4).toFixed(1)); q('.xpt','fill','var(--bg)');
  l.querySelector('.xpt').textContent=shown.toFixed(3);
  l.style.display='block';
  const b=SC.s[p.idx], t=box.querySelector('.xhbox');
  if(b&&t){
    const up=b[4]>=b[1];
    t.innerHTML=b[0]+' &nbsp;开 '+b[1].toFixed(3)+' &nbsp;高 '+b[2].toFixed(3)+' &nbsp;低 '+b[3].toFixed(3)
      +' &nbsp;<b style="color:'+(up?'var(--up)':'var(--dn)')+'">收 '+b[4].toFixed(3)+'</b>'
      +(p.snapTo ? ' &nbsp;· <span class="sn">吸附 '+p.snapTo+' '+p.snap.toFixed(3)+'</span>'
                 : ' &nbsp;· 光标 '+shown.toFixed(3));
    t.style.display='block';
  }
}

function onChartClick(ev){

  if(!MTOOL||!SC) return;
  const p=pick(ev); if(!p) return;
  const key=dkey(); DRAWS[key]=DRAWS[key]||[];

    DRAWS[key].push({k:'t',d1:PEND.d,y1:PEND.y,d2:p.date,y2:p.snap}); PEND=null;
  }

  drawModal();
}

/* ---- 本地刷新 ------------------------------------------------------------
   Yahoo 不发 CORS 头，浏览器直接 fetch 会被拦，所以数据由同文件夹的
   refresh-server.ps1 代取（「启动.bat」会开它）。双击 html 直接打开时，
   页面照常看历史数据，只是刷新按钮会提示要走 启动.bat。            */
const LOCAL = /^https?:$/.test(location.protocol)
           && /^(127\.0\.0\.1|localhost)$/.test(location.hostname);
// CLOUD = 发布到 claude.ai 的那一份。它没有本地中转站，而 artifact 的 CSP 直接禁止
// 页面 fetch 任何外部主机（比 CORS 更硬），所以拿不到 Yahoo：日线、日图确认、刷新、
// 收盘通知在云端一律不存在，第 1-3 步（周线）照常。
// 双击 html（file://）也是 !LOCAL，但那种情况的解法是「用启动.bat打开」，跟云端不同，
// 所以这里把两者分开。同一份文件同时服务本地和云端，不做两套构建、不会走岔。
const CLOUD = !LOCAL && location.protocol !== 'file:';
const RF=$('refresh'), RM=$('rfmsg');
function rmsg(t,col){ if(RM){ RM.textContent=t; RM.style.color=col||'var(--ink3)'; } }

const med=a=>{const s=[...a].sort((x,y)=>x-y),n=s.length;
  return n?(n%2?s[(n-1)/2]:(s[n/2-1]+s[n/2])/2):0;};
// 同 wr 的定义：近 52 周 (高−低)/收 的中位数
const wrOf=w=>{
  const t=w.slice(-52).map(b=>b[4]?(b[2]-b[3])/b[4]*100:0).filter(v=>isFinite(v)&&v>0);
  return t.length?Math.round(med(t)*10)/10:0;
};
const r4=v=>Math.round(v*1e4)/1e4;
// 本地时间 YYYY-MM-DD HH:MM —— 刷新完和下次开页读缓存都用它，两边写法一致
const p2=n=>String(n).padStart(2,'0');
const fmtT=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())
  +' '+p2(d.getHours())+':'+p2(d.getMinutes());
// Yahoo 的周线时间戳是「该周周一 00:00（交易所时区）」，但最后还会多挂一根
// 用最新报价时间戳的实时行，跟本周那根重复。所以一律把日期归到所在周的周一，
// 同一个周一的两根合并（开取先、收取后、高低取极值）——合并后与原始快照逐位相同。
function barsFromYahoo(j){
  const r=j&&j.chart&&j.chart.result&&j.chart.result[0];
  if(!r||!r.timestamp||!r.indicators||!r.indicators.quote) return null;
  const q=r.indicators.quote[0], off=((r.meta&&r.meta.gmtoffset)||0)*1000, out=[];
  for(let i=0;i<r.timestamp.length;i++){
    let o=q.open[i],h=q.high[i],l=q.low[i],c=q.close[i];
    const vol=q.volume?q.volume[i]:null;
    // 零成交的占位K线：Yahoo 在没有成交的日子用前一天收盘填一根出来，四个价完全
    // 相等、量为 0。价格是真的，但那一天没有任何人以那个价成交过。实测 666 只近一
    // 年有 13611 根这种K线（占 8.2%，每一只股都有），其中 572 次撑起了当周的最高价
    // ——MAXIS 那条 3.79 的突破线就是这么来的，那周真实成交的最高只有 3.60。
    // 放它进来，第 3、5 步甚至可能被一笔根本不存在的交易触发。
    // 判断用「原始四价相等」，所以盘中那根只有收盘的实时行不会被误杀（它 open 是
    // null，进不了这个条件）。
    if(!(vol>0) && o>0 && o===h && h===l && l===c) continue;
    // Yahoo 末尾那根「实时行」经常只有收盘是真的，开/高/低填 0 或 null。
    // 0 不是 null——旧的判空放它过去，本周最低价就变成 0：图上拖出一条到底的
    // 下影线，打底判定还会把这根假新低当成「又创新低」而把形态打断。
    // 所以一律按「必须 > 0」来判，缺的用收盘补，而不是整根丢掉（丢掉会连
    // 当天的最高价一起丢，突破日就漏了）。
    if(!(c>0) && i===r.timestamp.length-1 && r.meta && r.meta.regularMarketPrice>0) c=r.meta.regularMarketPrice;
    if(!(c>0)) continue;
    if(!(o>0)) o=c;
    if(!(h>0)) h=Math.max(o,c);
    if(!(l>0)) l=Math.min(o,c);
    h=Math.max(h,o,c); l=Math.min(l,o,c);        // 高低必须包住开收
    const t=new Date(r.timestamp[i]*1000+off);
    const mon=new Date(t.getTime()-((t.getUTCDay()+6)%7)*864e5).toISOString().slice(0,10);
    const p=out[out.length-1];
    if(p&&p[0]===mon){ p[2]=Math.max(p[2],r4(h)); p[3]=Math.min(p[3],r4(l)); p[4]=r4(c); }
    else out.push([mon,r4(o),r4(h),r4(l),r4(c)]);
  }
  return out.length?out:null;
}

// ---- 日线：开图时按需抓 ---------------------------------------------------
// 日线不做归周合并，一天就是一根；Yahoo 偶尔会在末尾多挂一根同日期的实时行，
// 同日期就并进上一根。
function barsDaily(j){
  const r=j&&j.chart&&j.chart.result&&j.chart.result[0];
  if(!r||!r.timestamp||!r.indicators||!r.indicators.quote) return null;
  const q=r.indicators.quote[0], off=((r.meta&&r.meta.gmtoffset)||0)*1000, out=[];
  for(let i=0;i<r.timestamp.length;i++){
    let o=q.open[i],h=q.high[i],l=q.low[i],c=q.close[i];
    const vol=q.volume?q.volume[i]:null;
    // 零成交的占位K线：Yahoo 在没有成交的日子用前一天收盘填一根出来，四个价完全
    // 相等、量为 0。价格是真的，但那一天没有任何人以那个价成交过。实测 666 只近一
    // 年有 13611 根这种K线（占 8.2%，每一只股都有），其中 572 次撑起了当周的最高价
    // ——MAXIS 那条 3.79 的突破线就是这么来的，那周真实成交的最高只有 3.60。
    // 放它进来，第 3、5 步甚至可能被一笔根本不存在的交易触发。
    // 判断用「原始四价相等」，所以盘中那根只有收盘的实时行不会被误杀（它 open 是
    // null，进不了这个条件）。
    if(!(vol>0) && o>0 && o===h && h===l && l===c) continue;
    // Yahoo 末尾那根「实时行」经常只有收盘是真的，开/高/低填 0 或 null。
    // 0 不是 null——旧的判空放它过去，本周最低价就变成 0：图上拖出一条到底的
    // 下影线，打底判定还会把这根假新低当成「又创新低」而把形态打断。
    // 所以一律按「必须 > 0」来判，缺的用收盘补，而不是整根丢掉（丢掉会连
    // 当天的最高价一起丢，突破日就漏了）。
    if(!(c>0) && i===r.timestamp.length-1 && r.meta && r.meta.regularMarketPrice>0) c=r.meta.regularMarketPrice;
    if(!(c>0)) continue;
    if(!(o>0)) o=c;
    if(!(h>0)) h=Math.max(o,c);
    if(!(l>0)) l=Math.min(o,c);
    h=Math.max(h,o,c); l=Math.min(l,o,c);        // 高低必须包住开收
    const dt=new Date(r.timestamp[i]*1000+off).toISOString().slice(0,10);
    const p=out[out.length-1];
    if(p&&p[0]===dt){ p[2]=Math.max(p[2],r4(h)); p[3]=Math.min(p[3],r4(l)); p[4]=r4(c); }
    else out.push([dt,r4(o),r4(h),r4(l),r4(c)]);
  }
  return out.length?out:null;
}

async function loadDaily(d){
  if(DAILY.has(d.t)) return true;
  const hint=$('mhint');
  if(!LOCAL){
    if(hint) hint.innerHTML='<b style="color:var(--sup)">日线要经过本地中转站</b>：请用文件夹里的「启动.bat」打开本页，再点日线。';
    return false;
  }
  const box=$('mchart'), keep=box?box.innerHTML:'';
  if(box) box.innerHTML=`<p class="note">正在抓 ${esc(d.t)} 的日线…</p>`;
  try{
    const r=await fetch('/api/y?iv=1d&syms='+encodeURIComponent(d.sym+':10y'));
    if(!r.ok) throw new Error('中转站没响应');
    const j=await r.json();
    const bars=barsDaily(j[d.sym]);
    if(!bars||bars.length<30) throw new Error('Yahoo 没给出这只股的日线');
    DAILY.set(d.t,bars);
    return true;
  }catch(e){
    if(box) box.innerHTML=keep;
    if(hint) hint.innerHTML='日线抓取失败：'+esc(e.message||e);
    return false;
  }
}


// 批量跑第 4 步：只跑「刚发生」窗口内的那些（其余的突破早就过去了，日图确认没意义）。
// 确认只需要突破前后那几十天，所以批量抓 3 年日线就够，比图表用的 10 年小得多。
async function dayConfirmAll(){
  const p=P();
  const targets=ROWS.filter(d=>d.sig && d.sig.ago<=p.recentWeeks);
  if(!targets.length){ rmsg('当前窗口内没有突破的股票'); return; }
  if(!LOCAL){ rmsg('日图确认要经过本地中转站：请用「启动.bat」打开本页','var(--sup)'); return; }
  const B=10; let done=0;
  for(let i=0;i<targets.length;i+=B){
    const chunk=targets.slice(i,i+B);
    const need=chunk.filter(d=>!DAILY.has(d.t)&&!DCACHE.has(d.t));
    if(need.length){
      try{
        const r=await fetch('/api/y?iv=1d&syms='+encodeURIComponent(need.map(d=>d.sym+':3y').join(',')));
        const j=r.ok?await r.json():{};
        for(const d of need){ const bars=barsDaily(j[d.sym]); if(bars) DCACHE.set(d.t,bars); }
      }catch(e){}
    }
    for(const d of chunk){
      DAYOK.set(d.t, dayCheck(DAILY.get(d.t)||DCACHE.get(d.t), d.sig.lvl, d.sig.sup, d.sig.revDate, p.dayN, d.sig.band, p.pbDays));
    }
    done+=chunk.length;
    rmsg('日图确认 '+done+'/'+targets.length+'…');
  }
  // Yahoo 一次被问 50 多个代码时，偶尔会对其中几个返回空——不重试的话它们会挂在
  // 「无法判定」里，看起来像判定出错，其实只是没抓到。小批补抓一次再判。
  const missed=targets.filter(d=>!DAILY.has(d.t)&&!DCACHE.has(d.t));
  if(missed.length){
    rmsg('补抓 '+missed.length+' 只日线…');
    for(let i=0;i<missed.length;i+=5){
      const ch=missed.slice(i,i+5);
      try{
        const r=await fetch('/api/y?iv=1d&syms='+encodeURIComponent(ch.map(d=>d.sym+':3y').join(',')));
        const j=r.ok?await r.json():{};
        for(const d of ch){ const bars=barsDaily(j[d.sym]); if(bars) DCACHE.set(d.t,bars); }
      }catch(e){}
    }
    for(const d of missed)
      DAYOK.set(d.t, dayCheck(DAILY.get(d.t)||DCACHE.get(d.t), d.sig.lvl, d.sig.sup, d.sig.revDate, p.dayN, d.sig.band, p.pbDays));
  }
  const tally={ok:0,wait:0,fail:0,other:0}, pb={in:0,deep:0,wait:0,none:0};
  for(const d of targets){
    const r=DAYOK.get(d.t);
    tally[r&&['ok','wait','fail'].includes(r.state)?r.state:'other']++;
    if(r&&r.state==='ok'&&r.pull) pb[['in','deep','wait'].includes(r.pull.state)?r.pull.state:'none']++;
  }
  document.querySelectorAll('.secbody').forEach(b=>delete b.dataset.done);
  render();
  rmsg(`日图确认 ${targets.length} 只 · 守住 ${tally.ok}（回踩到位 ${pb.in}、偏深 ${pb.deep}、没回踩 ${pb.none}、还在等 ${pb.wait}）`
       +` · 观察中 ${tally.wait} · 跌回 ${tally.fail}`+(tally.other?` · 无法判定 ${tally.other}`:''),
       pb.in?'var(--rev)':'#e8b339');
}

async function refreshAll(){
  // 周线不再直接跟 Yahoo 要 interval=1wk —— 那份周线里的最高／最低价可能来自
  // 「零成交的占位日K」，而在周线层面根本认不出来（周线不带那天的成交量）。
  // 改成抓日线、清洗掉占位K、再自己按周一合并成周线。barsFromYahoo 本来就是
  // 按周一合并的，所以把日线喂给它，出来就是干净的周线，不用另写聚合器。
  // 代价：10 年日线比 10 年周线大约 25 倍，刷新从十几秒变成一分多钟。
  const B=15, bad=[]; let done=0, ok=0;
  for(let i=0;i<DATA.length;i+=B){
    const chunk=DATA.slice(i,i+B);
    // 本地版一律抓满 10 年。上市不足 10 年的股票，Yahoo 只给到它上市那天为止。
    const qs=chunk.map(d=>d.sym+':10y').join(',');
    let res=null;
    try{
      const r=await fetch('/api/y?iv=1d&syms='+encodeURIComponent(qs));
      if(r.ok) res=await r.json();
    }catch(e){}
    for(const d of chunk){
      const w=res&&barsFromYahoo(res[d.sym]);      // 日线进，周线出
      if(w&&w.length>=60){ d.w=w; d.wr=wrOf(w); ok++; } else bad.push(d.t);
    }
    done+=chunk.length;
    rmsg('刷新中 '+done+'/'+DATA.length+'…（抓日线自建周线，约需 1-2 分钟）');
  }
  if(!ok) throw new Error('一只都没抓到，检查网络');
  SNAP=DATA.reduce((m,d)=>{const x=d.w[d.w.length-1][0];return x>m?x:m;},'');
  document.querySelectorAll('.secbody').forEach(b=>delete b.dataset.done);
  render();
  const now=new Date();
  let saved='';
  try{
    const r=await fetch('/api/save',{method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({snap:SNAP,ts:now.toISOString(),
        rows:DATA.map(d=>({t:d.t,wr:d.wr,w:d.w}))})});
    saved=r.ok?' · 已存本地':' · 保存失败';
  }catch(e){ saved=' · 保存失败'; }
  rmsg('已更新 '+ok+'/'+DATA.length+' 只 · 刷新于 '+fmtT(now)
       +' · 数据截至 '+SNAP+saved
       +(bad.length?' · 失败 '+bad.slice(0,6).join(' ')+(bad.length>6?'…':''):''),
       bad.length?'#e8b339':'var(--rev)');
}

async function loadCache(){
  if(!LOCAL) return;
  try{
    const r=await fetch('data.json?'+Date.now());
    if(!r.ok) return;
    const j=await r.json();
    if(!j||!Array.isArray(j.rows)) return;
    const m=new Map(j.rows.map(x=>[x.t,x]));
    let n=0;
    for(const d of DATA){
      const x=m.get(d.t);
      if(x&&Array.isArray(x.w)&&x.w.length){ d.w=x.w; if(x.wr!=null) d.wr=x.wr; n++; }
    }
    if(!n) return;
    if(j.snap) SNAP=j.snap;
    document.querySelectorAll('.secbody').forEach(b=>delete b.dataset.done);
    render();
    const dt=new Date(j.ts||'');
    rmsg('本地数据 · 上次刷新 '
      +(isNaN(dt)?String(j.ts||'').slice(0,16).replace('T',' '):fmtT(dt)));
  }catch(e){}
}

// ---- 无人值守扫描（?scan=1）------------------------------------------------
// 计划任务用无头浏览器打开 /?scan=1：页面照常刷新数据、跑 scan、跑 dayCheck，
// 再把结果 POST 回中转站，由 scan-notify.ps1 去比对上一轮并发通知。
// 关键是「判定规则只有这一份」——通知用的就是你在屏幕上看到的那套算法，
// 不存在两边算法漂掉的可能。参数也一样，改了这里通知跟着改。
async function autoScan(){
  const out={ts:new Date().toISOString(), snap:'', ok:false, err:'', p:P(), items:[]};
  try{
    if(!LOCAL) throw new Error('不是经过中转站打开的，抓不了数据');
    await loadCache();
    await refreshAll();                 // 顺手把 data.json 也更新了
    await dayConfirmAll();
    const p=P();
    out.snap=SNAP;
    for(const d of ROWS){
      const s=d.sig; if(!s || s.ago>p.recentWeeks) continue;
      const r=DAYOK.get(d.t)||{};
      const lastW=d.w[d.w.length-1]||[];
      out.items.push({t:d.t, sym:d.sym, n:d.n, sec:d.s,
        revDate:s.revDate, ago:s.ago, sup:s.sup, lvl:s.lvl, band:s.band,
        state:r.state||'', day:r.day||'', day4:r.day4||'', failDay:r.failDay||'',
        pull:(r.pull&&r.pull.state)||'', pullDay:(r.pull&&r.pull.day)||'',
        px:(r.last!=null?r.last:lastW[4]), pxDate:r.lastDate||lastW[0]});
    }
    out.ok=true;
  }catch(e){ out.err=String((e&&e.message)||e); }
  try{
    await fetch('/api/alert',{method:'POST',
      headers:{'Content-Type':'application/json'},body:JSON.stringify(out)});
  }catch(e){}
  // 标题是给 scan-notify.ps1 之外的人看的；它自己是靠 /api/alert 落地的文件判断完成
  document.title = out.ok ? 'SCAN-DONE '+out.items.length : 'SCAN-FAIL';
  try{ rmsg('自动扫描完成：'+out.items.length+' 条'); }catch(e){}
  setTimeout(()=>{ try{ window.close(); }catch(e){} },1500);
}

// ---- 补看上一次收盘扫描的通知 ----------------------------------------------
// 桌面弹窗会自己消失，人不在电脑前就等于没发过。alerts.json 是同一批内容的
// 落地版，打开看板时补一次，按「知道了」才算读过（记 ts，不会重复烦你）。
const AKEY='bursa_alert_seen';
async function showAlerts(){
  const box=$('alertbar'); if(!box) return;
  try{
    const r=await fetch('/alerts.json?'+Date.now()); if(!r.ok) return;
    const a=await r.json();
    if(!a||!a.total||!Array.isArray(a.lines)||!a.lines.length) return;
    let seen=''; try{ seen=localStorage.getItem(AKEY)||''; }catch(e){}
    if(seen===a.ts) return;
    // 超过 5 天的就别再顶在最上面了，那已经不是新闻
    if(a.ts && (Date.now()-new Date(a.ts).getTime())>5*864e5) return;
    box.innerHTML=`<div class="abar">
      <div class="ah">上次收盘扫描（${esc(String(a.ts).slice(0,16).replace('T',' '))}）· ${a.total} 条
        <button class="ax" data-aseen="${esc(a.ts)}">知道了</button></div>
      <div class="al">${a.lines.map(l=>esc(l)).join('<br>')}</div></div>`;
  }catch(e){}
}
$('alertbar').addEventListener('click',e=>{
  const b=e.target.closest('[data-aseen]'); if(!b) return;
  try{ localStorage.setItem(AKEY,b.dataset.aseen); }catch(err){}
  $('alertbar').innerHTML='';
});

// ---- ?signals=1：把「刚发生」的信号吐成 JSON，不联网、不写任何东西 -----------
// 给 GitHub Actions 用的：CI 生成好页面之后，用无头 Chrome 打开这个模式、
// --dump-dom 把结果读出来，当作通知摘要。
// 关键是「规则只有一份」：摘要跟看板显示的必然一致，因为算的就是同一段 scan()。
// 以前 CI 里另外有一份 Python 抄写的 scan()，四个月不到就漂成完全不同的规则
// （支撑观察 13 周 vs 52 周），而且没人发现 —— 那份已经删掉了。
function dumpSignals(){
  const p=P(), out=[];
  for(const d of ROWS){
    const s=d.sig; if(!s || s.ago>p.recentWeeks) continue;
    out.push({t:d.t, sym:d.sym, n:d.n, s:d.s, i:d.i||'', core:d.x?0:1, wr:d.wr,
      revDate:s.revDate, breakDate:s.breakDate, ago:s.ago, base:s.base,
      sup:s.sup, bh:s.bh, bl:s.bl, lvl:s.lvl, band:s.band, rev:s.rev,
      reclaim:Math.round((s.rev-s.sup)/s.sup*1000)/10});
  }
  const pre=document.createElement('pre');
  pre.id='sigout';
  pre.textContent=JSON.stringify({snap:SNAP, params:p, count:ROWS.length, signals:out});
  document.body.appendChild(pre);
  document.title='SIGNALS '+out.length;
}

render();
if(/[?&]signals=1/.test(location.search)) dumpSignals();
else if(/[?&]scan=1/.test(location.search)) autoScan();
else { loadCache(); initWatchFile(); if(!CLOUD) showAlerts(); }
})();
</script>
