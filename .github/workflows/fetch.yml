name: Fetch Bursa prices

# Bursa closes 17:00 MYT (09:00 UTC). Run at 09:10 UTC so the final bar is settled,
# leaving the Claude routine (09:40 UTC) half an hour to pick the data up.
on:
  schedule:
    - cron: "10 9 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch from Yahoo Finance
        run: python fetch.py

      - name: Commit if changed
        run: |
          git config user.name  "bursa-data bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --staged --quiet; then
            echo "No change."
          else
            git commit -m "data: $(date -u +%Y-%m-%d)"
            git push
          fi
